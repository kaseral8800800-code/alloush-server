/* ═══════════════════════════════════════════════════════════
   MUSIC ENGINE (Calm + Hype melodies)
   ═══════════════════════════════════════════════════════════ */
function stopMusic(){
  if(musicNode){try{musicNode.stop();musicNode.disconnect()}catch(e){}musicNode=null}
  if(musicCtx){try{musicCtx.close()}catch(e){}musicCtx=null}
  state.music=null;
}
function playMusic(key){
  stopMusic();
  if(key==="none"){render();return}
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const master=ctx.createGain();
    master.gain.value=db.user.timerConfig?.volume||.35;
    master.connect(ctx.destination);
    musicCtx=ctx;
    const nodes=[];
    const config={
      calm:{tempo:70,notes:[261.63,329.63,392,493.88,440,392,329.63,261.63],wave:"sine",vol:.35,decay:2.5},
      focus:{tempo:90,notes:[220,261.63,329.63,261.63,246.94,293.66,349.23,293.66],wave:"triangle",vol:.32,decay:1.8},
      energetic:{tempo:130,notes:[440,523.25,659.25,523.25,493.88,587.33,698.46,587.33],wave:"square",vol:.22,decay:.8},
      workout:{tempo:150,notes:[392,523.25,659.25,784,659.25,523.25,659.25,784],wave:"sawtooth",vol:.18,decay:.6},
      piano:{tempo:80,notes:[261.63,311.13,349.23,392,440,392,349.23,311.13],wave:"sine",vol:.38,decay:2},
      lofi:{tempo:75,notes:[196,233.08,261.63,233.08,174.61,220,261.63,220],wave:"triangle",vol:.35,decay:2.2}
    }[key]||{tempo:80,notes:[261.63,329.63,392,440],wave:"sine",vol:.3,decay:2};
    const beat=60/config.tempo/2;
    let step=0;
    const playNote=()=>{
      if(!musicCtx||musicCtx.state==="closed")return;
      try{
        const osc=ctx.createOscillator();
        const gain=ctx.createGain();
        osc.type=config.wave;
        osc.frequency.value=config.notes[step%config.notes.length];
        gain.gain.setValueAtTime(0,ctx.currentTime);
        gain.gain.linearRampToValueAtTime(config.vol,ctx.currentTime+.02);
        gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+config.decay);
        osc.connect(gain);gain.connect(master);
        osc.start();osc.stop(ctx.currentTime+config.decay+.1);
        // Add bass note every 4 beats
        if(step%4===0){
          const bass=ctx.createOscillator();
          const bg=ctx.createGain();
          bass.type="sine";
          bass.frequency.value=config.notes[step%config.notes.length]/2;
          bg.gain.setValueAtTime(0,ctx.currentTime);
          bg.gain.linearRampToValueAtTime(config.vol*.6,ctx.currentTime+.05);
          bg.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+config.decay*1.5);
          bass.connect(bg);bg.connect(master);
          bass.start();bass.stop(ctx.currentTime+config.decay*1.6);
        }
      }catch(e){}
      step++;
    };
    const timer=setInterval(playNote,beat*1000);
    playNote();
    musicNode={stop:()=>{clearInterval(timer);try{master.disconnect()}catch(e){}}};
    state.music=key;
  }catch(e){toast("تعذر تشغيل الموسيقى","err");return}
  render();
}

function playBeep(type){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const freqs={bell:[880,1320],chime:[660,990,1320],digital:[1200,1600],nature:[440,660]}[type]||[880,1320];
    freqs.forEach((f,i)=>{
      setTimeout(()=>{
        const o=ctx.createOscillator();
        const g=ctx.createGain();
        o.frequency.value=f;o.type="sine";
        g.gain.setValueAtTime(.001,ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(.3,ctx.currentTime+.02);
        g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+1.5);
        o.connect(g);g.connect(ctx.destination);
        o.start();o.stop(ctx.currentTime+1.5);
      },i*250);
    });
  }catch(e){}
}

function togglePomodoro(){
  const cfg=db.user.timerConfig||{work:25,short:5,long:15};
  if(!state.pomodoro)state.pomodoro={sec:cfg.work*60,on:false,type:"focus"};
  if(state.pomodoro.on){state.pomodoro.on=false;clearInterval(pomodoroTimer);render();return}
  state.pomodoro.on=true;render();
  pomodoroTimer=setInterval(()=>{
    if(!state.pomodoro||!state.pomodoro.on){clearInterval(pomodoroTimer);return}
    state.pomodoro.sec--;
    const el=document.getElementById("pomodoroTime");
    if(el){const m=Math.floor(state.pomodoro.sec/60),s=state.pomodoro.sec%60;el.textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")}
    if(state.pomodoro.sec<=0){
      clearInterval(pomodoroTimer);
      const wasFocus=state.pomodoro.type==="focus";
      if(wasFocus){
        db.user.focusSessions=(db.user.focusSessions||0)+1;
        db.user.focusMinutes=(db.user.focusMinutes||0)+cfg.work;
        const today=new Date().toISOString().slice(0,10);
        if(db.user.lastFocusDate===today)db.user.todayFocusSessions=(db.user.todayFocusSessions||0)+1;
        else{db.user.lastFocusDate=today;db.user.todayFocusSessions=1}
        saveDB();
        const na=checkAch();if(na.length)setTimeout(()=>showAchPop(na[0].n),400);
      }
      state.pomodoro.on=false;
      state.pomodoro.type=wasFocus?"short":"focus";
      state.pomodoro.sec=state.pomodoro.type==="focus"?cfg.work*60:cfg.short*60;
      playBeep("bell");
      toast(wasFocus?"انتهى وقت التركيز!":"انتهت الراحة!","ok");
      try{if(navigator.vibrate)navigator.vibrate([200,100,200])}catch(e){}
      render();
    }
  },1000);
}
function resetPomodoro(){clearInterval(pomodoroTimer);const cfg=db.user.timerConfig||{work:25};state.pomodoro={sec:cfg.work*60,on:false,type:"focus"};render();toast("تمت الإعادة","ok")}
function skipPomodoro(){
  clearInterval(pomodoroTimer);
  const cfg=db.user.timerConfig||{work:25,short:5};

  render();
}

}

function doSearch(q){
  q=(q||"").trim().toLowerCase();
  const box=document.getElementById("gsr");
  if(!q){box.innerHTML=`<div class="empty-sm">ابدأ بالكتابة</div>`;return}
  const r=[];
  subjectsForGrade(myGrade()).forEach(s=>{
    if(s.name.toLowerCase().includes(q))r.push({t:"s",s});
    s.units.forEach(u=>u.lessons.forEach(l=>{if(l.name.toLowerCase().includes(q))r.push({t:"l",s,l,u})}));
  });
  if(!r.length){box.innerHTML=`<div class="empty-sm">لا نتائج</div>`;return}
  box.innerHTML=r.slice(0,30).map(x=>x.t==="s"?`
    <div class="lesson" onclick="closeModal();openSub('${x.s.id}')">
      <div class="lesson-ic">${iconK(x.s.icon)}</div>
      <div class="lesson-info"><b>${esc(x.s.name)}</b><small>مادة</small></div>
    </div>`:`

      <div class="lesson-ic">${I.play}</div>
      <div class="lesson-info"><b>${esc(x.l.name)}</b><small>${esc(x.s.name)}</small></div>
    </div>`).join("");
}

function parseBulkText(){
  const lid=document.getElementById("btL").value;
  const text=document.getElementById("btT").value||"";
  const l=lessonBy(lid);if(!l)return toast("الدرس غير موجود","err");
  const lines=text.split("\n").filter(x=>x.trim());let ok=0,f=0;
  lines.forEach(line=>{
    try{
      const parts=line.split("|").map(x=>x.trim());
      if(parts.length<6)return f++;
      const q=parts[0],a=parts.slice(1,5),c=parseInt(parts[5])-1;
      if(!q||a.some(x=>!x)||isNaN(c)||c<0||c>3)return f++;
      l.questions.push({q,a,correct:c,exp:""});ok++;
    }catch(e){f++}
  });
  if(ok){saveDB();closeModal();render();toast(`تم ${ok}${f?` (فشل ${f})`:''}`,"ok")}else toast("فشل","err");
}
function newBulkCSV(){
  const o=[];db.subjects.forEach(s=>s.units.forEach(u=>u.lessons.forEach(l=>o.push(`<option value="${l.id}">${esc(s.name)} — ${esc(l.name)}</option>`))));

function parseBulkCSV(){
  const lid=document.getElementById("csvL").value;
  const text=document.getElementById("csvT").value||"";
  const l=lessonBy(lid);if(!l)return toast("الدرس غير موجود","err");
  const lines=text.split("\n").filter(x=>x.trim());let ok=0,f=0;
  lines.forEach((line,idx)=>{
    if(idx===0&&/السؤال|question/i.test(line))return;
    try{
      const parts=line.split(",").map(x=>x.trim().replace(/^"|"$/g,""));
      if(parts.length<6)return f++;
      const q=parts[0],a=parts.slice(1,5),c=parseInt(parts[5])-1,exp=parts[6]||"";
      if(!q||a.some(x=>!x)||isNaN(c)||c<0||c>3)return f++;
      l.questions.push({q,a,correct:c,exp});ok++;
    }catch(e){f++}
  });
  if(ok){saveDB();closeModal();render();toast(`تم ${ok}${f?` (فشل ${f})`:''}`,"ok")}else toast("فشل","err");
}

function importDB(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{try{const x=JSON.parse(r.result);if(!x.subjects||!x.settings)throw Error();if(!x.user)x.user=clone(DEF.user);if(!x.users)x.users=[];db=x;saveDB();_banned=await checkLB();applyTheme();render();toast("تم","ok")}catch(err){toast("ملف غير صالح","err")}};r.readAsText(f)}
async function resetSys(){if(!confirm("إعادة النظام؟"))return;const kb=(db.bannedDevices||[]).slice();db=clone(DEF);db.bannedDevices=kb;saveDB();stack=[];_banned=await checkLB();applyTheme();render();toast("تم","ok")}

function newUnit(){if(!db.subjects.length)return toast("أضف مادة","err");showModal(`<div class="modal-h"><h3>${I.plus} وحدة</h3><button class="ib" onclick="closeModal()">${I.x}</button></div>

function newUnitFor(sid){if(!db.subjects.length)return toast("لا مواد","err");showModal(`<div class="modal-h"><h3>${I.plus} وحدة</h3><button class="ib" onclick="closeModal()">${I.x}</button></div>

function saveUnit(){const s=subj(document.getElementById("uS").value);const n=document.getElementById("uN").value.trim();if(!n||!s)return toast("أكمل","err");s.units.push({id:uid("u"),name:n,lessons:[]});saveDB();closeModal();render();toast("تم","ok")}
function findU(id){for(const s of db.subjects){const u=s.units.find(x=>x.id===id);if(u)return{s,u}}return null}
function editUnit(id){const r=findU(id);if(!r)return;showModal(`<div class="modal-h"><h3>${I.edit} وحدة</h3><button class="ib" onclick="closeModal()">${I.x}</button></div>

function newLesson(){if(!db.subjects.some(s=>s.units.length))return toast("أضف وحدة","err");const o=[];db.subjects.forEach(s=>s.units.forEach(u=>o.push(`<option value="${u.id}">${esc(s.name)} — ${esc(u.name)}</option>`)));showModal(`<div class="modal-h"><h3>${I.plus} درس</h3><button class="ib" onclick="closeModal()">${I.x}</button></div>

function newLessonFor(uid){if(!db.subjects.some(s=>s.units.length))return toast("لا وحدات","err");const o=[];db.subjects.forEach(s=>s.units.forEach(u=>o.push(`<option value="${u.id}" ${u.id===uid?"selected":""}>${esc(s.name)} — ${esc(u.name)}</option>`)));showModal(`<div class="modal-h"><h3>${I.plus} درس</h3><button class="ib" onclick="closeModal()">${I.x}</button></div>
  <div class="field" style="margin-bottom:10px"><label>الوحدة</label><select class="inp" id="lU">${o.join("")}</select></div>
  <div class="field" style="margin-bottom:10px"><label>الاسم</label><input class="inp" id="lN"></div>
  <div class="field" style="margin-bottom:10px"><label>الوصف</label><textarea class="inp" id="lD" rows="2"></textarea></div>
  <button class="btn btn-primary btn-block" onclick="saveLesson()">${I.save}</button>`)}

function saveLesson(){const u=findUById(document.getElementById("lU").value);const n=document.getElementById("lN").value.trim();if(!n||!u)return toast("أكمل","err");u.lessons.push({id:uid("l"),name:n,desc:document.getElementById("lD").value.trim(),questions:[]});saveDB();closeModal();render();toast("تم","ok")}
function editLesson(id){const l=lessonBy(id);if(!l)return;showModal(`<div class="modal-h"><h3>${I.edit} درس</h3><button class="ib" onclick="closeModal()">${I.x}</button></div>
  <div class="field" style="margin-bottom:10px"><label>الاسم</label><input class="inp" id="fN" value="${esc(l.name)}"></div>
  <div class="field" style="margin-bottom:10px"><label>الوصف</label><textarea class="inp" id="fD" rows="2">${esc(l.desc||"")}</textarea></div>
  <button class="btn btn-primary btn-block" onclick="updLesson('${id}')">${I.save}</button>`)}
function updLesson(id){const l=lessonBy(id);if(!l)return;l.name=document.getElementById("fN").value.trim();l.desc=document.getElementById("fD").value.trim();saveDB();closeModal();render();toast("تم","ok")}
function delLesson(id){const l=lessonBy(id);if(!l)return;if(!confirm(`حذف "${l.name}"؟`))return;db.subjects.forEach(s=>s.units.forEach(u=>u.lessons=u.lessons.filter(x=>x.id!==id)));saveDB();render();toast("تم","ok")}
function newQ(lid){const o=[];db.subjects.forEach(s=>s.units.forEach(u=>u.lessons.forEach(l=>o.push(`<option value="${l.id}" ${l.id===lid?"selected":""}>${esc(s.name)} — ${esc(l.name)}</option>`))));if(!o.length)return toast("أضف درساً","err");showModal(`<div class="modal-h"><h3>${I.plus} سؤال</h3><button class="ib" onclick="closeModal()">${I.x}</button></div>
  <div class="field" style="margin-bottom:10px"><label>الدرس</label><select class="inp" id="qL">${o.join("")}</select></div>
  <div class="field" style="margin-bottom:10px"><label>السؤال</label><textarea class="inp" id="qT" rows="2"></textarea></div>
  <div class="fg">
    <div class="field"><label>A</label><input class="inp" id="qa"></div>
    <div class="field"><label>B</label><input class="inp" id="qb"></div>
    <div class="field"><label>C</label><input class="inp" id="qc"></div>
    <div class="field"><label>D</label><input class="inp" id="qd"></div>
    <div class="field"><label>الصحيحة</label><select class="inp" id="qC"><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select></div>
    <div class="field"><label>شرح</label><input class="inp" id="qE"></div>
  </div><div style="height:10px"></div>
  <button class="btn btn-primary btn-block" onclick="saveQ()">${I.save}</button>`)}
function saveQ(){const l=lessonBy(document.getElementById("qL").value);const q=document.getElementById("qT").value.trim();const a=[qa.value.trim(),qb.value.trim(),qc.value.trim(),qd.value.trim()];if(!q||a.some(x=>!x)||!l)return toast("أكمل","err");l.questions.push({q,a,correct:Number(document.getElementById("qC").value),exp:document.getElementById("qE").value.trim()});saveDB();closeModal();render();toast("تم","ok")}
function manageQ(id){const l=lessonBy(id);if(!l)return;const items=l.questions.map((q,i)=>`
  <div style="padding:10px;background:var(--surface-2);border-radius:9px;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px">
    <div style="flex:1;min-width:0">
      <b style="font-size:11.5px;font-weight:800">${i+1}. ${esc(q.q)}</b>
      <div style="font-size:10px;color:var(--text-3);margin-top:3px">${q.a.map((x,j)=>`${String.fromCharCode(65+j)}: ${esc(x)}`).join(" • ")}</div>
      <div style="color:var(--success);font-size:10px;margin-top:2px;font-weight:800">${I.check} ${String.fromCharCode(65+q.correct)}</div>
    </div>
    <button class="mb dng" onclick="delQ('${id}',${i})">${I.trash}</button>
  </div>`).join("");
  showModal(`<div class="modal-h"><h3>${I.layers} ${esc(l.name)} (${l.questions.length})</h3><button class="ib" onclick="closeModal()">${I.x}</button></div>
  <div class="btn-row" style="margin-bottom:10px">
    <button class="btn btn-primary btn-sm" onclick="closeModal();newQ('${id}')">${I.plus}</button>
    <button class="btn btn-warn btn-sm" onclick="closeModal();importJSONFor('${id}')">${I.code}</button>
    <button class="btn btn-danger btn-sm" onclick="delAllQ('${id}')">${I.trash}</button>
  </div>
  <div style="max-height:50vh;overflow-y:auto">${items||`<div class="empty-sm">لا أسئلة</div>`}</div>`)}
function delQ(lid,i){const l=lessonBy(lid);if(!l)return;if(confirm("حذف؟")){l.questions.splice(i,1);saveDB();closeModal();manageQ(lid);toast("تم","ok")}}
function delAllQ(lid){const l=lessonBy(lid);if(!l)return;if(!confirm("حذف الكل؟"))return;l.questions=[];saveDB();closeModal();render();toast("تم","ok")}
function importJSON(){const o=[];db.subjects.forEach(s=>s.units.forEach(u=>u.lessons.forEach(l=>o.push(`<option value="${l.id}">${esc(s.name)} — ${esc(l.name)} (${l.questions.length})</option>`))));if(!o.length)return toast("أضف درساً","err");showModal(`<div class="modal-h"><h3>${I.code} JSON</h3><button class="ib" onclick="closeModal()">${I.x}</button></div>
  <div class="field" style="margin-bottom:10px"><label>الدرس</label><select class="inp" id="jL">${o.join("")}</select></div>
  <div class="field" style="margin-bottom:10px"><label>JSON</label><textarea class="inp mono" id="jT" rows="8" style="direction:ltr;text-align:left;font-family:monospace;font-size:11px"></textarea></div>
  <div class="code-box" style="background:#0a1628;color:#7dd3fc;border-radius:10px;padding:10px;font-family:monospace;font-size:10.5px;direction:ltr;text-align:left;margin-bottom:10px">correct: 0=A • 1=B • 2=C • 3=D</div>
  <button class="btn btn-primary btn-block" onclick="parseJSON()">${I.check}</button>`)}
function importJSONFor(lid){const o=[];db.subjects.forEach(s=>s.units.forEach(u=>u.lessons.forEach(l=>o.push(`<option value="${l.id}" ${l.id===lid?"selected":""}>${esc(s.name)} — ${esc(l.name)}</option>`))));if(!o.length)return toast("لا دروس","err");showModal(`<div class="modal-h"><h3>${I.code} JSON</h3><button class="ib" onclick="closeModal()">${I.x}</button></div>
  <div class="field" style="margin-bottom:10px"><label>الدرس</label><select class="inp" id="jL">${o.join("")}</select></div>
  <div class="field" style="margin-bottom:10px"><label>JSON</label><textarea class="inp mono" id="jT" rows="8" style="direction:ltr;text-align:left;font-family:monospace;font-size:11px"></textarea></div>
  <button class="btn btn-primary btn-block" onclick="parseJSON()">${I.check}</button>`)}
function parseJSON(){
  const lid=document.getElementById("jL").value;const t=(document.getElementById("jT").value||"").trim();
  if(!t)return toast("الصق JSON","err");
  let d;try{d=JSON.parse(t)}catch(e){return toast("JSON خاطئ","err")}
  let a=Array.isArray(d)?d:(d&&Array.isArray(d.questions)?d.questions:null);
  if(!a||!a.length)return toast("فارغ","err");
  const l=lessonBy(lid);if(!l)return toast("الدرس غير موجود","err");
  let ok=0,f=0;
  a.forEach(it=>{try{const q=String(it.q||"").trim();if(!q)return f++;let arr=it.a;if(!Array.isArray(arr)||arr.length<2)return f++;arr=arr.map(x=>String(x==null?"":x));while(arr.length<4)arr.push("");arr=arr.slice(0,4);if(arr.some(x=>!x.trim()))return f++;const c=Number(it.correct);if(isNaN(c)||c<0||c>3)return f++;l.questions.push({q,a:arr,correct:c,exp:it.exp?String(it.exp):""});ok++}catch(e){f++}});
  if(ok){saveDB();closeModal();render();toast(`تم ${ok}${f?` (فشل ${f})`:''}`,"ok")}else toast("فشل","err");
}

/* ═══════════════════════════════════════════════════════════
   BAN WATCH
   ═══════════════════════════════════════════════════════════ */
function setupBanWatch(){
  if(cloud.banUnsub){try{cloud.banUnsub()}catch(e){}cloud.banUnsub=null}
  if(!cloud.ok)return;
  cloud.banUnsub=fsWatchBan(DEVICE_ID,async(b,d)=>{
    if(b&&!_banned){
      _banned=true;await setLB(DEVICE_ID,"");
      if((db.bannedDevices||[]).indexOf(DEVICE_ID)===-1){if(!db.bannedDevices)db.bannedDevices=[];db.bannedDevices.push(DEVICE_ID);saveDB()}
      clearInterval(quizTimer);state.quiz=null;render();toast("تم حظر هذا الجهاز","err");
    } else if(!b&&_banned){
      _banned=false;await remLB(DEVICE_ID);
      db.bannedDevices=(db.bannedDevices||[]).filter(d=>d!==DEVICE_ID);
      saveDB();render();toast("تم فك الحظر","ok");
    }
  });
}

/* ═══════════════════════════════════════════════════════════
   BOOT
   ═══════════════════════════════════════════════════════════ */
(async function boot(){
  try{await buildDeviceId()}catch(e){if(!DEVICE_ID)DEVICE_ID="DEV-UNKNOWN-000000"}
  try{_banned=await checkLB()}catch(e){_banned=false}
  applyTheme();
  if(!db.subjects.length){
    const mk=(g,n,ic,d)=>({id:uid("s"),grade:g,name:n,icon:ic,desc:d,units:[]});
    db.subjects=[
      mk("sci","الرياضيات","calculator","الجبر والهندسة والتفاضل"),
      mk("sci","الفيزياء","atom","الميكانيكا والكهرباء"),
      mk("sci","الكيمياء","flask","الكيمياء العضوية وغير العضوية"),
      mk("sci","علم الأحياء","leaf","الخلية والوراثة"),
      mk("lit","اللغة العربية","book","النحو والأدب والبلاغة"),
      mk("lit","الفلسفة","brain","المنطق وفلسفة العلوم"),
      mk("lit","التاريخ","scroll","التاريخ العربي والعالمي"),
      mk("lit","الجغرافيا","globe","الجغرافيا الطبيعية والبشرية"),
      mk("ninth","الرياضيات","calculator","الجبر والهندسة"),
      mk("ninth","العلوم","atom","الفيزياء والكيمياء والأحياء"),
      mk("ninth","اللغة العربية","book","النحو والأدب"),
      mk("ninth","اللغة الإنجليزية","globe","قواعد ومحادثة")
    ];
    saveDB();
  }
  try{history.pushState({d:0},"")}catch(e){}
  render();
  initFB().then(async ok=>{
    if(ok){
      const cb=await fsBan(DEVICE_ID);
      if(cb){_banned=true;await setLB(DEVICE_ID,"");if((db.bannedDevices||[]).indexOf(DEVICE_ID)===-1){if(!db.bannedDevices)db.bannedDevices=[];db.bannedDevices.push(DEVICE_ID);saveDB()}}
      setupBanWatch();
      const l=await fsBans();if(l)state.cloudBans=l;
      render();
    }
  });
  document.addEventListener("visibilitychange",async()=>{
    if(!document.hidden){
      const l=await checkLB();
      if(l&&!_banned){_banned=true;render();return}
      if(cloud.ok){const cb=await fsBan(DEVICE_ID);if(cb&&!_banned){_banned=true;await setLB(DEVICE_ID,"");render()}}
    }
  });
  document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
})();
</script>
