function openSidebar(){document.getElementById('sidebar').classList.add('show');document.getElementById('sidebarOverlay').classList.add('show');loadLeaderboard();}

async function loadLeaderboard(){var l=document.getElementById('leaderboardList');l.innerHTML='<p class="lb-empty">⏳ تحميل...</p>';try{var s=await db.collection('contest_scores').orderBy('score','desc').limit(50).get();if(s.empty){l.innerHTML='<p class="lb-empty">😴 لا توجد نتائج</p>';return;}var p={};s.forEach(function(d){var x=d.data();if(!p[x.userId])p[x.userId]={name:x.userName||'طالب',score:0,tests:0};p[x.userId].score+=x.score||0;p[x.userId].tests+=1;});var arr=[];for(var uid in p)arr.push(p[uid]);arr.sort(function(a,b){return b.score-a.score});var h='';for(var i=0;i<Math.min(arr.length,10);i++){var r=arr[i],rc='',medal='';if(i===0){rc='rank-1';medal='🥇';}else if(i===1){rc='rank-2';medal='🥈';}else if(i===2){rc='rank-3';medal='🥉';}h+='<div class="lb-item '+rc+'"><div class="lb-rank">'+(medal||('#'+(i+1)))+'</div><div class="lb-name">'+r.name+'<br><span style="font-size:8px;color:#999">'+r.tests+' اختبار</span></div><div class="lb-score">'+r.score+' نقطة</div></div>';}l.innerHTML=h;}catch(e){l.innerHTML='<p class="lb-empty">❌ خطأ</p>';}}
async function saveScoreToLeaderboard(score,total){var name=localStorage.getItem('student_name')||'طالب';var uid=localStorage.getItem('student_uid')||('u_'+Date.now());localStorage.setItem('student_uid',uid);try{await db.collection('contest_scores').add({userId:uid,userName:name,score:score,total:total,subject:selSubject,date:firebase.firestore.FieldValue.serverTimestamp()});}catch(e){}}

async function loadNews(){try{var s=await db.collection('news').orderBy('createdAt','desc').limit(5).get();var nd=[];s.forEach(function(d){nd.push(d.data());});renderNews(nd);}catch(e){document.getElementById('newsContainer').innerHTML='';}}
function renderNews(nd){var c=document.getElementById('newsContainer');if(nd.length===0){c.innerHTML='';return;}var t='';for(var i=0;i<nd.length;i++){t+='<span class="news-item">🆕 '+nd[i].text+' <span class="news-date">اليوم</span></span>';}t+=t;c.innerHTML='<div class="news-bar"><div class="news-scroll"><div class="news-track">'+t+'</div></div></div>';}

async function loadNewsList(){var l=document.getElementById('newsList');if(!l)return;var s=await db.collection('news').orderBy('createdAt','desc').get();if(s.empty){l.innerHTML='<p style="color:#aaa;font-size:10px">لا توجد أخبار</p>';return;}var h='';s.forEach(function(d){h+='<div style="background:rgba(255,255,255,0.05);padding:8px;border-radius:6px;margin:4px 0;font-size:10px;display:flex;justify-content:space-between;align-items:center"><span>'+d.data().text+'</span><button onclick="deleteNewsItem(\''+d.id+'\')" style="background:#d94040;color:white;border:none;border-radius:4px;padding:3px 8px;cursor:pointer;font-size:9px">✕</button></div>';});l.innerHTML=h;}

function toggleChat(){chatOpen=!chatOpen;var popup=document.getElementById('chatPopup');var badge=document.getElementById('chatBadge');if(chatOpen){popup.classList.add('show');badge.style.display='none';loadChatMessages();if(chatListener)chatListener();startChatListener();}else{popup.classList.remove('show');}}
function startChatListener(){chatListener=db.collection('chat_messages').orderBy('createdAt','desc').limit(30).onSnapshot(function(snap){if(chatOpen){renderChatMessages(snap);}else{var nc=snap.size;if(nc>lastMessageCount){var badge=document.getElementById('chatBadge');var unread=nc-lastMessageCount;badge.textContent=unread>99?'99+':unread;badge.style.display='flex';}lastMessageCount=nc;}});}
async function loadChatMessages(){try{var s=await db.collection('chat_messages').orderBy('createdAt','desc').limit(30).get();renderChatMessages(s);lastMessageCount=s.size;}catch(e){}}
async function loadBannedWords(){try{var snap=await db.collection('banned_words').get();bannedWords=[];snap.forEach(function(doc){bannedWords.push(doc.data().word);});}catch(e){}}
async function loadBannedUsers(){try{var snap=await db.collection('banned_users').get();bannedUsers=[];snap.forEach(function(doc){bannedUsers.push(doc.data().userId);});}catch(e){}}
function filterBadWords(text){var filtered=text;for(var i=0;i<bannedWords.length;i++){var word=bannedWords[i];var stars='';for(var j=0;j<word.length;j++)stars+='*';var regex=new RegExp(word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');filtered=filtered.replace(regex,stars);}return filtered;}
function isUserBanned(userId){return bannedUsers.indexOf(userId)!==-1;}
async function sendMessage(){var input=document.getElementById('chatInput');var text=input.value.trim();if(!text)return;var name=localStorage.getItem('student_name')||'طالب';var uid=localStorage.getItem('student_uid')||('u_'+Date.now());localStorage.setItem('student_uid',uid);await loadBannedUsers();if(isUserBanned(uid)){alert('🚫 أنت محظور من الشات');return;}await loadBannedWords();text=filterBadWords(text);try{await db.collection('chat_messages').add({userId:uid,userName:name,text:text,createdAt:firebase.firestore.FieldValue.serverTimestamp()});input.value='';}catch(e){}}
function renderChatMessages(snap){var c=document.getElementById('chatMessages');if(snap.empty){c.innerHTML='<p class="chat-empty">💬 لا توجد رسائل بعد</p>';return;}var msgs=[];snap.forEach(function(doc){msgs.push({id:doc.id,...doc.data()});});msgs.reverse();var sname=localStorage.getItem('student_name')||'طالب';var suid=localStorage.getItem('student_uid')||'';var h='';for(var i=0;i<msgs.length;i++){var m=msgs[i];var isMe=(m.userId===suid);var time=m.createdAt?new Date(m.createdAt.seconds*1000).toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit'}):'';var isAdminUser=(m.userName==='admin'||m.userName==='Admin');h+='<div class="chat-msg '+(isMe?'me':'other')+'">';if(!isMe){h+='<div class="msg-name">';if(isAdminUser)h+='<span class="admin-badge">👑 مشرف</span>';h+='👤 '+m.userName+'</div>';}h+=m.text;h+='<div class="msg-time">'+time;if(sname==='admin'){h+=' <span class="msg-del" onclick="deleteChatMsg(\''+m.id+'\')">🗑️</span>';h+=' <span class="msg-del" onclick="banUser(\''+m.userId+'\',\''+m.userName+'\')">🚫</span>';}h+='</div></div>';}c.innerHTML=h;c.scrollTop=c.scrollHeight;}
async function deleteChatMsg(id){if(!confirm('حذف؟'))return;try{await db.collection('chat_messages').doc(id).delete();}catch(e){}}
async function banUser(userId,userName){if(!confirm('🚫 حظر '+userName+'؟'))return;try{await db.collection('banned_users').add({userId:userId,userName:userName,bannedAt:firebase.firestore.FieldValue.serverTimestamp()});await loadBannedUsers();alert('✅ تم حظر '+userName);}catch(e){}}
async function unbanUser(docId){if(!confirm('🔓 فك الحظر؟'))return;try{await db.collection('banned_users').doc(docId).delete();await loadBannedUsers();loadBannedUsersList();alert('✅ تم فك الحظر');}catch(e){}}
async function addBannedWord(){var word=document.getElementById('newBadWord').value.trim().toLowerCase();if(!word)return;try{await db.collection('banned_words').add({word:word});document.getElementById('newBadWord').value='';await loadBannedWords();loadBannedWordsList();}catch(e){}}
async function deleteBannedWord(docId){try{await db.collection('banned_words').doc(docId).delete();await loadBannedWords();loadBannedWordsList();}catch(e){}}
async function loadBannedUsersList(){var list=document.getElementById('bannedUsersList');if(!list)return;try{var snap=await db.collection('banned_users').get();if(snap.empty){list.innerHTML='<p style="color:#aaa;font-size:10px">لا يوجد محظورين</p>';return;}var h='';snap.forEach(function(doc){var d=doc.data();h+='<div style="background:rgba(255,255,255,0.05);padding:8px;border-radius:6px;margin:4px 0;font-size:10px;display:flex;justify-content:space-between;align-items:center"><span>🚫 '+d.userName+'</span><button onclick="unbanUser(\''+doc.id+'\')" style="background:#4CAF50;color:white;border:none;border-radius:4px;padding:3px 8px;cursor:pointer;font-size:9px">🔓 فك</button></div>';});list.innerHTML=h;}catch(e){}}
async function loadBannedWordsList(){var list=document.getElementById('bannedWordsList');if(!list)return;try{var snap=await db.collection('banned_words').get();if(snap.empty){list.innerHTML='<p style="color:#aaa;font-size:10px">لا توجد كلمات محظورة</p>';return;}var h='';snap.forEach(function(doc){h+='<div class="word-item"><span>🔇 '+doc.data().word+'</span><button onclick="deleteBannedWord(\''+doc.id+'\')" style="background:#d94040;color:white;border:none;border-radius:4px;padding:3px 8px;cursor:pointer;font-size:9px">✕</button></div>';});list.innerHTML=h;}catch(e){}}
async function clearAllChat(){if(!confirm('⚠️ مسح جميع رسائل الشات؟'))return;var msg=document.getElementById('chatAdminMsg');if(msg)msg.innerHTML='⏳ جاري المسح...';var s=await db.collection('chat_messages').get();var batch=db.batch();s.forEach(function(d){batch.delete(d.ref);});await batch.commit();if(msg)msg.innerHTML='<span style="color:#0f0">✅ تم مسح جميع الرسائل</span>';}

async function joinChallengeDirect(challengeId){

        if(data.status==='done'){alert('✅ انتهى التحدي!\n'+data.creatorName+': '+data.creatorScore+'\n'+data.joinerName+': '+data.joinerScore);return;}

        showPage('quiz');document.getElementById('quizScreen').innerHTML=h;
    }catch(e){alert('❌ خطأ: '+e.message);}
}

function updateAdUnitNames(){var s=document.getElementById('adSubject').value;var us=document.getElementById('adUnit');for(var j=0;j<us.options.length;j++)us.options[j].text='الوحدة '+(j+1)+': '+unitNames[s][j];updateAdLesson();}
function updateAdLesson(){var s=document.getElementById('adSubject').value;var u=parseInt(document.getElementById('adUnit').value)-1;var ls=lessonNames[s][u];var h='';for(var i=0;i<ls.length;i++)h+='<option value="'+ls[i]+'">'+(i+1)+'. '+ls[i]+'</option>';document.getElementById('adLesson').innerHTML=h;}
function buildQuestionForms(){var count=parseInt(document.getElementById('adCount').value);var h='';for(var i=1;i<=count;i++){h+='<div class="q-block"><b>❓ سؤال '+i+'</b>';h+='<textarea id="q_q'+i+'" placeholder="نص السؤال"></textarea>';for(var j=0;j<4;j++){h+='<input type="text" id="q_o'+i+'_'+j+'" placeholder="الخيار '+(j+1)+'">';}h+='<label>الإجابة الصحيحة:</label><select id="q_c'+i+'"><option value="0">الخيار 1</option><option value="1">الخيار 2</option><option value="2">الخيار 3</option><option value="3">الخيار 4</option></select></div>';}document.getElementById('adQuestions').innerHTML=h;}
async function saveManualQuestions(){var subject=document.getElementById('adSubject').value;var unit=parseInt(document.getElementById('adUnit').value);var lesson=document.getElementById('adLesson').value;var count=parseInt(document.getElementById('adCount').value);var msg=document.getElementById('adMessage');if(!lesson){msg.innerHTML='<span style="color:#ff4444">❌ اختر الدرس</span>';return;}msg.innerHTML='⏳ جاري الحفظ...';var saved=0;var batch=db.batch();for(var i=1;i<=count;i++){var qEl=document.getElementById('q_q'+i);if(!qEl)continue;var q=qEl.value.trim();if(!q)continue;var opts=[];var allFilled=true;for(var j=0;j<4;j++){var oEl=document.getElementById('q_o'+i+'_'+j);if(!oEl||!oEl.value.trim()){allFilled=false;break;}opts.push(oEl.value.trim());}if(!allFilled)continue;var cEl=document.getElementById('q_c'+i);var c=cEl?parseInt(cEl.value):0;var ref=db.collection('questions').doc();batch.set(ref,{subject:subject,unit:unit,lesson:lesson,q:q,o:opts,c:c,createdAt:firebase.firestore.FieldValue.serverTimestamp()});saved++;}if(saved>0){await batch.commit();msg.innerHTML='<span style="color:#00e676">✅ تم حفظ '+saved+' سؤال!</span>';buildQuestionForms();}else{msg.innerHTML='<span style="color:#ff4444">❌ املأ سؤال واحد على الأقل</span>';}}
function updateAdUnitNamesJson(){var s=document.getElementById('adSubjectJson').value;var us=document.getElementById('adUnitJson');for(var j=0;j<us.options.length;j++)us.options[j].text='الوحدة '+(j+1)+': '+unitNames[s][j];updateAdLessonJson();}
function updateAdLessonJson(){var s=document.getElementById('adSubjectJson').value;var u=parseInt(document.getElementById('adUnitJson').value)-1;var ls=lessonNames[s][u];var h='';for(var i=0;i<ls.length;i++)h+='<option value="'+ls[i]+'">'+(i+1)+'. '+ls[i]+'</option>';document.getElementById('adLessonJson').innerHTML=h;}
async function importJSON(){var json=document.getElementById('adJsonInput').value.trim();if(!json){document.getElementById('adMessageJson').innerHTML='<span style="color:#ff4444">❌ الصق الأسئلة</span>';return;}try{var qs=JSON.parse(json);if(!Array.isArray(qs)){document.getElementById('adMessageJson').innerHTML='<span style="color:#ff4444">❌ يجب أن يكون مصفوفة</span>';return;}var s=document.getElementById('adSubjectJson').value,u=parseInt(document.getElementById('adUnitJson').value),l=document.getElementById('adLessonJson').value;if(!l){document.getElementById('adMessageJson').innerHTML='<span style="color:#ff4444">❌ اختر الدرس</span>';return;}var msg=document.getElementById('adMessageJson');msg.innerHTML='⏳ جاري الاستيراد...';var batch=db.batch(),sv=0;for(var i=0;i<qs.length;i++){var q=qs[i];if(q.q&&q.o&&Array.isArray(q.o)&&q.o.length===4){var ref=db.collection('questions').doc();batch.set(ref,{subject:s,unit:u,lesson:l,q:q.q,o:q.o,c:typeof q.c==='number'?q.c:0,createdAt:firebase.firestore.FieldValue.serverTimestamp()});sv++;}}if(sv>0){await batch.commit();msg.innerHTML='<span style="color:#00e676">✅ تم استيراد '+sv+' سؤال!</span>';document.getElementById('adJsonInput').value='';}else msg.innerHTML='<span style="color:#ff4444">❌ خطأ في الصيغة</span>';}catch(e){document.getElementById('adMessageJson').innerHTML='<span style="color:#ff4444">❌ '+e.message+'</span>';}}
async function fillAllUnits(){var msg=document.getElementById('adMessageAuto');msg.innerHTML='⏳ جاري إنشاء 392 سؤال...';var aq=[],subs=Object.keys(unitNames);for(var si=0;si<subs.length;si++)for(var ui=0;ui<7;ui++)for(var li=0;li<7;li++)aq.push({subject:subs[si],unit:ui+1,lesson:lessonNames[subs[si]][ui][li],q:'ما هو مفهوم '+lessonNames[subs[si]][ui][li]+' في '+unitNames[subs[si]][ui]+' - '+subs[si]+'؟',o:['الإجابة الصحيحة','إجابة خاطئة 1','إجابة خاطئة 2','إجابة خاطئة 3'],c:0});var batch=db.batch(),c=0,bc=0;for(var i=0;i<aq.length;i++){var ref=db.collection('questions').doc();batch.set(ref,aq[i]);c++;bc++;if(bc>=400){await batch.commit();batch=db.batch();bc=0;msg.innerHTML='⏳ تم حفظ '+c+' من '+aq.length+'...';}}if(bc>0)await batch.commit();msg.innerHTML='<span style="color:#00e676;font-size:14px">🎉 تمت إضافة '+c+' سؤال!</span>';}
async function loadQuestionList(){var ct=document.getElementById('listQuestions');ct.innerHTML='<p style="text-align:center;color:#aaa">⏳ تحميل...</p>';var s=document.getElementById('listSubject').value,u=parseInt(document.getElementById('listUnit').value);var q=db.collection('questions').orderBy('createdAt','desc').limit(50);if(s!=='all')q=q.where('subject','==',s);if(u>0)q=q.where('unit','==',u);var sn=await q.get();if(sn.empty){ct.innerHTML='<p style="text-align:center;color:#aaa">لا توجد أسئلة</p>';return;}var h='<p style="font-size:10px;color:#aaa">عدد الأسئلة: '+sn.size+'</p>';sn.forEach(function(d){var d2=d.data();h+='<div style="background:rgba(255,255,255,0.05);padding:8px;border-radius:6px;margin-bottom:4px;font-size:10px"><b>['+d2.subject+']</b> وح'+d2.unit+' - '+d2.lesson+'<br>❓ '+d2.q+'<br>✅ '+d2.o[d2.c]+'</div>';});ct.innerHTML=h;}
function updateDelLesson(){var s=document.getElementById('delSubject').value;var u=parseInt(document.getElementById('delUnit').value);var h='<option value="">كل الدروس</option>';if(u>0){var ls=lessonNames[s][u-1];for(var i=0;i<ls.length;i++)h+='<option value="'+ls[i]+'">'+ls[i]+'</option>';}document.getElementById('delLesson').innerHTML=h;}
async function deleteQuestions(){var s=document.getElementById('delSubject').value,u=parseInt(document.getElementById('delUnit').value),l=document.getElementById('delLesson').value;if(!confirm('⚠️ تأكيد الحذف؟'))return;var msg=document.getElementById('delMessage');msg.innerHTML='⏳ جاري الحذف...';var q=db.collection('questions').where('subject','==',s);if(u>0)q=q.where('unit','==',u);if(l)q=q.where('lesson','==',l);var sn=await q.get(),c=sn.size;if(c===0){msg.innerHTML='<span style="color:#ff9800">⚠️ لا توجد أسئلة</span>';return;}var batch=db.batch();sn.forEach(function(d){batch.delete(d.ref);});await batch.commit();msg.innerHTML='<span style="color:#00e676">✅ تم حذف '+c+' سؤال!</span>';}

(function checkChallengeLink(){
    var params=new URLSearchParams(window.location.search);
    var challengeId=params.get('challenge');
    if(challengeId){
        setTimeout(async function(){
            var myName=localStorage.getItem('student_name');
            if(!myName){
                document.getElementById('namePrompt').style.display='flex';
                window._pendingChallenge=challengeId;
                return;
            }
            joinChallengeDirect(challengeId);
        },2000);
    }
})();
