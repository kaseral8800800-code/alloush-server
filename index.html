// ==================== نظام الرجوع خطوة بخطوة ====================
function navigateTo(page){
    navHistory.push(page);
    showPage(page);
}

function goBack(){
    if(navHistory.length > 1){
        navHistory.pop();
        var prev = navHistory[navHistory.length-1];
        showPage(prev);
    } else {
        showPage('home');
    }
    // إغلاق أي نوافذ مفتوحة
    closeDialog();
    document.getElementById('sidebar').classList.remove('show');
    document.getElementById('sidebarOverlay').classList.remove('show');
    document.getElementById('challengeOverlay').style.display = 'none';
}

// الاستماع لزر الرجوع في الهاتف
window.addEventListener('popstate', function(e){
    goBack();
});

function showPage(page){
    document.getElementById('homePage').style.display = page==='home'?'flex':'none';
    document.getElementById('unitsPage').style.display = page==='units'?'flex':'none';
    document.getElementById('quizPage').style.display = page==='quiz'?'flex':'none';
}

async function startCustomQuiz(){var sc=0;for(var i=0;i<7;i++)if(chkLessons[i])sc++;if(sc===0){alert('⚠️ اختر درساً واحداً على الأقل');return;}closeDialog();var subject=selSubject;var unitNum=selUnitIdx+1;navigateTo('quiz');document.getElementById('quizScreen').innerHTML='<div class="loading-screen"><div class="loading-spinner"></div><p>⏳ تحميل الأسئلة...</p></div>';try{var snapshot=await db.collection('questions').where('subject','==',subject).where('unit','==',unitNum).get();var allQ=[];snapshot.forEach(function(doc){var d=doc.data();var lessonIdx=lessonNames[subject][unitNum-1].indexOf(d.lesson);if(lessonIdx!==-1&&chkLessons[lessonIdx])allQ.push(d);});if(allQ.length===0){document.getElementById('quizScreen').innerHTML='<div style="text-align:center;padding:40px;flex:1"><div style="font-size:50px">📭</div><p>لا توجد أسئلة</p><button class="btn-outline" onclick="goBack()">📚 رجوع</button></div>';return;}if(selMode==='random')allQ=shuf(allQ);if(selQCount!=='all'){var n=parseInt(selQCount);if(!isNaN(n)&&n>0&&n<allQ.length)allQ=allQ.slice(0,n);}Q=allQ;tq=Q.length;cq=0;sc=0;wr=[];renderQ();}catch(e){document.getElementById('quizScreen').innerHTML='<div style="text-align:center;padding:40px"><p>خطأ</p><button class="btn-outline" onclick="goBack()">📚 رجوع</button></div>';}}

function shuf(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=b[i];b[i]=b[j];b[j]=t}return b}
function shufOpt(o,c){var s=shuf(o.map(function(x,i){return{value:x,orig:i}}));return{options:s.map(function(x){return x.value}),correct:s.findIndex(function(x){return x.value===o[c]})}}
function renderQ(){if(cq>=tq){showScore();return}an=false;rs=selTime;clearTimeout(window._to);var q=Q[cq],r=shufOpt(q.o,q.c);so=r.options;cai=r.correct;var h='<div class="quiz-top-bar"><button class="q-btn-sm" onclick="goBack()">←</button><span>'+selSubject+'</span><span id="timerBadge">⏱ '+rs+'</span></div>';h+='<div class="quiz-body"><div class="q-card" id="qCard">';h+='<div style="display:flex;justify-content:space-between;margin-bottom:5px"><span style="background:#1a8a4a;color:white;padding:2px 7px;border-radius:7px;font-size:10px">'+(cq+1)+'/'+tq+'</span><span style="font-size:8px;color:#666">'+(q.lesson||'')+'</span></div>';h+='<div class="q-text">'+q.q+'</div><div class="q-options">';for(var i=0;i<so.length;i++){h+='<div class="q-opt" id="opt'+i+'" onclick="pick('+i+')"><div class="opt-indicator">'+lb[i]+'</div><div>'+so[i]+'</div></div>'}h+='</div><div id="answerNote" style="text-align:center;padding:4px;margin-top:4px;border-radius:6px;font-size:9px;display:none"></div></div></div>';document.getElementById('quizScreen').innerHTML=h;startTimer();}
function pick(i){if(an)return;an=true;clearInterval(window._ti);clearTimeout(window._to);document.querySelectorAll('.q-opt').forEach(function(o){o.classList.add('disabled')});var card=document.getElementById('qCard'),note=document.getElementById('answerNote');if(i===cai){document.getElementById('opt'+i).classList.add('correct');sc++;if(card)card.classList.add('correct-card');if(note){note.style.display='block';note.style.background='rgba(120,220,150,0.4)';note.style.color='#2E7D32';note.innerHTML='🎉 صحيح!'}window._to=setTimeout(function(){cq++;cq>=tq?showScore():renderQ();},1200);}else{document.getElementById('opt'+i).classList.add('wrong');document.getElementById('opt'+cai).classList.add('correct');wr.push({q:Q[cq].q,a:so[cai]});if(card)card.classList.add('wrong-card');if(note){note.style.display='block';note.style.background='rgba(255,110,110,0.3)';note.style.color='#C62828';note.innerHTML='❌ الصحيح: <span style="color:#2E7D32;font-weight:700">'+so[cai]+'</span>'}window._to=setTimeout(function(){cq++;cq>=tq?showScore():renderQ();},2500);}}
function startTimer(){clearInterval(window._ti);rs=selTime;var badge=document.getElementById('timerBadge');window._ti=setInterval(function(){rs--;if(badge){badge.innerHTML='⏱ '+rs;if(rs<=5)badge.style.color='#FF5252'}if(rs<=0){clearInterval(window._ti);if(!an){an=true;document.querySelectorAll('.q-opt').forEach(function(o){o.classList.add('disabled')});document.getElementById('opt'+cai).classList.add('correct');wr.push({q:Q[cq].q,a:so[cai]});window._to=setTimeout(function(){cq++;cq>=tq?showScore():renderQ();},2500);}}},1000);}
function showScore(){clearInterval(window._ti);clearTimeout(window._to);var p=Math.round((sc/tq)*100),e=p>=90?'🏆':p>=75?'👏':p>=60?'👍':'💪';var h='<div class="quiz-top-bar"><span>🏁 النتيجة</span><div></div></div><div class="score-screen"><div style="font-size:55px">'+e+'</div><div class="score-ring">'+p+'%</div><p>'+sc+'/'+tq+'</p>';if(wr.length>0){h+='<div style="background:rgba(255,255,255,0.7);border-radius:10px;padding:8px;margin:6px 0;text-align:right"><b style="color:#d94040;font-size:10px">📋 الأخطاء</b>';for(var i=0;i<Math.min(wr.length,5);i++){h+='<div style="background:rgba(255,110,110,0.2);padding:6px;border-radius:6px;margin:2px 0;font-size:9px;border-right:2px solid #FF5252"><span style="color:#C62828">❌ '+wr[i].q+'</span><br><span style="color:#2E7D32">✅ '+wr[i].a+'</span></div>'}h+='</div>';}h+='<button class="btn" onclick="startQuiz()">🔄 إعادة</button><button class="btn-outline" onclick="showUnits(selSubject)">📚 رجوع</button></div>';saveScoreToLeaderboard(sc,tq);if(currentChallengeId){var myUid=localStorage.getItem('student_uid');db.collection('challenges').doc(currentChallengeId).get().then(function(doc){var data=doc.data();var updateData={};if(data.player1Id===myUid){updateData.player1Score=sc;}else if(data.player2Id===myUid){updateData.player2Score=sc;}if((data.player1Score>0||(data.player1Id===myUid))&&(data.player2Score>0||(data.player2Id===myUid))){if(data.player1Id===myUid&&data.player2Score>0)updateData.status='done';if(data.player2Id===myUid&&data.player1Score>0)updateData.status='done';}db.collection('challenges').doc(currentChallengeId).update(updateData);});}document.getElementById('quizScreen').innerHTML=h;}

// ==================== نظام التحدي ====================
function openChallenges(){var h='<div class="dialog-box" style="max-width:95%;width:95%"><h3>🎯 تحدي الأصدقاء</h3>';h+='<div style="display:flex;gap:5px;margin-bottom:10px">';h+='<button class="challenge-btn" onclick="createChallenge()">➕ إنشاء تحدي جديد</button>';h+='</div><div id="challengeContent"></div>';h+='<button class="btn-red" onclick="document.getElementById(\'challengeOverlay\').style.display=\'none\'" style="width:100%;margin-top:10px">❌ إغلاق</button></div>';document.getElementById('challengeOverlay').innerHTML=h;document.getElementById('challengeOverlay').style.display='flex';loadMyChallenges();}
async function loadMyChallenges(){var content=document.getElementById('challengeContent');if(!content)return;var myUid=localStorage.getItem('student_uid');if(!myUid){content.innerHTML='<p style="text-align:center;color:#aaa">سجل دخولك أولاً</p>';return;}content.innerHTML='<p style="text-align:center;color:#aaa">⏳ تحميل...</p>';try{var snap=await db.collection('challenges').where('players','array-contains',myUid).orderBy('createdAt','desc').limit(10).get();if(snap.empty){content.innerHTML='<p style="text-align:center;color:#aaa;padding:20px">😴 لا توجد تحديات</p><p style="text-align:center"><button class="challenge-btn" onclick="createChallenge()">➕ إنشاء تحدي جديد</button></p>';return;}var h='<div class="challenge-list">';snap.forEach(function(doc){var d=doc.data();var p1=d.player1Name||'لاعب 1';var p2=d.player2Name||'لاعب 2';var s1=d.player1Score||0;var s2=d.player2Score||0;var status=d.status||'waiting';var st=status==='waiting'?'⏳ انتظار':(status==='playing'?'🟢 جاري':'✅ منتهي');h+='<div class="challenge-item"><div style="flex:1"><b>'+d.subject+'</b> - وحدة '+d.unit+'<br>'+p1+' 🆚 '+p2+'<br><span style="font-size:9px">'+st+'</span></div>';if(status==='waiting'||status==='playing'){h+='<button class="challenge-btn" onclick="joinChallengeRoom(\''+doc.id+'\')" style="width:auto;padding:8px 15px">▶️ دخول</button>';}if(status==='done'){h+='<div style="font-weight:900;color:gold">'+s1+' - '+s2+'</div>';}h+='<button class="copy-btn" onclick="copyChallengeLink(\''+doc.id+'\')">📋 نسخ</button></div>';});h+='</div>';content.innerHTML=h;}catch(e){}}
function createChallenge(){var h='<div style="padding:10px"><label>📚 المادة</label><select id="chalSubject">';Object.keys(smeta).forEach(function(s){h+='<option value="'+s+'">'+smeta[s].emoji+' '+s+'</option>';});h+='</select><label>📖 الوحدة</label><select id="chalUnit">';for(var i=1;i<=7;i++)h+='<option value="'+i+'">الوحدة '+i+'</option>';h+='</select><label>🔢 عدد الأسئلة</label><select id="chalCount">';[5,10,15,20].forEach(function(n){h+='<option value="'+n+'">'+n+' سؤال</option>';});h+='</select><button class="challenge-btn" onclick="generateChallenge()" style="margin-top:10px">🚀 إنشاء التحدي</button><div id="challengeLink" style="margin-top:10px"></div></div>';document.getElementById('challengeContent').innerHTML=h;}
async function generateChallenge(){var subject=document.getElementById('chalSubject').value;var unit=parseInt(document.getElementById('chalUnit').value);var count=parseInt(document.getElementById('chalCount').value)||10;var myName=localStorage.getItem('student_name')||'طالب';var myUid=localStorage.getItem('student_uid');var snap=await db.collection('questions').where('subject','==',subject).where('unit','==',unit).limit(count).get();var questions=[];snap.forEach(function(doc){questions.push(doc.data().q);});questions=questions.sort(function(){return Math.random()-0.5});var ref=await db.collection('challenges').add({subject:subject,unit:unit,player1Id:myUid,player1Name:myName,player1Score:0,player2Id:null,player2Name:null,player2Score:0,questions:questions,players:[myUid],status:'waiting',createdAt:firebase.firestore.FieldValue.serverTimestamp()});var link=window.location.href.split('?')[0]+'?challenge='+ref.id;document.getElementById('challengeLink').innerHTML='<div class="challenge-card"><h3>✅ تم إنشاء التحدي!</h3><p style="font-size:10px">انسخ الرابط وأرسله لصديقك</p><p style="font-size:10px;color:#ff9800">👥 الإثنين تدخلون نفس الرابط</p><div class="challenge-link" onclick="this.select()">'+link+'</div><button class="copy-btn" onclick="copyChallengeLink(\''+ref.id+'\')">📋 نسخ</button><button class="challenge-btn" onclick="joinChallengeRoom(\''+ref.id+'\')" style="margin-top:8px">▶️ دخول للتحدي</button></div>';}
function copyChallengeLink(id){var link=window.location.href.split('?')[0]+'?challenge='+id;navigator.clipboard.writeText(link).then(function(){alert('✅ تم نسخ الرابط!\nأرسله لصديقك');});}
async function joinChallengeRoom(challengeId){var myUid=localStorage.getItem('student_uid');var myName=localStorage.getItem('student_name')||'طالب';try{var docRef=db.collection('challenges').doc(challengeId);var doc=await docRef.get();if(!doc.exists){alert('❌ التحدي غير موجود');return;}var data=doc.data();var isPlayer1=(data.player1Id===myUid);if(!isPlayer1&&data.player2Id!==myUid){await docRef.update({player2Id:myUid,player2Name:myName,players:firebase.firestore.FieldValue.arrayUnion(myUid),status:'playing'});}currentChallengeId=challengeId;challengeSubject=data.subject;challengeQuestions=data.questions;var opponent=isPlayer1?(data.player2Name||'منتظر...'):data.player1Name;document.getElementById('challengeOverlay').style.display='none';var h='<div style="text-align:center;padding:30px"><div style="font-size:50px">⚡</div><h2 style="font-family:El Messiri,serif;color:#ff9800">تحدي الأصدقاء</h2><div class="vs">'+myName+' 🆚 '+opponent+'</div><p>📚 '+data.subject+' - وحدة '+data.unit+'</p><p style="color:#aaa">عدد الأسئلة: '+data.questions.length+'</p><p style="color:#ff9800;font-size:12px">⏱️ 15 ثانية لكل سؤال</p><button class="challenge-btn" onclick="startChallengeQuiz()" style="font-size:16px;padding:15px">🚀 ابدأ التحدي!</button></div>';navigateTo('quiz');document.getElementById('quizScreen').innerHTML=h;}catch(e){alert('❌ خطأ: '+e.message);}}
function startChallengeQuiz(){Q=[];for(var i=0;i<challengeQuestions.length;i++){Q.push({q:challengeQuestions[i],o:['الإجابة 1','الإجابة 2','الإجابة 3','الإجابة 4'],c:Math.floor(Math.random()*4),lesson:'تحدي'});}tq=Q.length;cq=0;sc=0;wr=[];selSubject=challengeSubject;selTime=15;renderQ();}

// ==================== فتح التحدي من الرابط ====================
(function checkChallengeLink(){var params=new URLSearchParams(window.location.search);var challengeId=params.get('challenge');if(challengeId){setTimeout(async function(){var myName=localStorage.getItem('student_name');if(!myName){document.getElementById('namePrompt').style.display='flex';window._pendingChallenge=challengeId;return;}joinChallengeRoom(challengeId);},1500);}})();

// ==================== تشغيل ====================
buildHome();
loadNews();
loadLinks();
</script>
