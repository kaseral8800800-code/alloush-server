<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0e1a">
<title>منصة علوش التعليمية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
<style>
:root{
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;--sp-7:32px;--sp-8:48px;
  --r-1:8px;--r-2:12px;--r-3:16px;--r-4:20px;--r-5:24px;--r-f:999px;
  --bg:#f6f8fb;--surface:#ffffff;--surface-2:#f9fbfd;--surface-3:#eff4fa;
  --border:#e3e9f2;--border-s:#cbd5e1;
  --text:#0a1628;--text-2:#475569;--text-3:#94a3b8;
  --brand:#0ea5e9;--brand-2:#0284c7;--brand-soft:#e0f2fe;
  --brand-glow:rgba(14,165,233,.35);
  --accent:#06b6d4;
  --success:#16a34a;--success-soft:#dcfce7;
  --warning:#f59e0b;--warning-soft:#fef3c7;
  --danger:#dc2626;--danger-soft:#fee2e2;
  --purple:#8b5cf6;--purple-soft:#ede9fe;
  --pink:#ec4899;--pink-soft:#fce7f3;
  --gold:#eab308;--gold-soft:#fef9c3;
  --sh-xs:0 1px 2px rgba(10,22,40,.04);
  --sh-sm:0 2px 6px rgba(10,22,40,.06);
  --sh-md:0 6px 18px rgba(10,22,40,.08);
  --sh-lg:0 16px 40px rgba(10,22,40,.12);
  --sh-xl:0 32px 64px rgba(10,22,40,.18);
  --sh-brand:0 8px 24px rgba(14,165,233,.28);
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
}
[data-theme="dark"]{
  --bg:#070b14;--surface:#0f1626;--surface-2:#131c30;--surface-3:#1a2438;
  --border:#1e293b;--border-s:#334155;
  --text:#f1f5f9;--text-2:#94a3b8;--text-3:#64748b;
  --brand:#38bdf8;--brand-2:#0ea5e9;--brand-soft:#0c2c44;
  --brand-glow:rgba(56,189,248,.25);
  --success:#4ade80;--success-soft:#0a2818;
  --warning:#fbbf24;--warning-soft:#2a1e08;
  --danger:#f87171;--danger-soft:#2a0e10;
  --purple:#a78bfa;--purple-soft:#1a1030;
  --pink:#f472b6;--pink-soft:#38121f;
  --gold:#facc15;--gold-soft:#2a2208;
  --sh-xs:0 1px 2px rgba(0,0,0,.4);
  --sh-sm:0 2px 8px rgba(0,0,0,.5);
  --sh-md:0 6px 18px rgba(0,0,0,.6);
  --sh-lg:0 16px 40px rgba(0,0,0,.7);
  --sh-xl:0 32px 64px rgba(0,0,0,.85);
  --sh-brand:0 8px 24px rgba(56,189,248,.2);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:'Cairo',system-ui,sans-serif;font-weight:600;font-size:13.5px;line-height:1.55;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;transition:background .3s,color .3s}
input,textarea,select,button{font-family:inherit;font-size:inherit;font-weight:inherit;color:inherit;outline:none;border:0;background:none}
button{cursor:pointer}
body{min-height:100vh;overflow-x:hidden}
.hidden{display:none!important}
svg{display:block;width:100%;height:100%}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:var(--border-s);border-radius:3px}

/* ══ SPLASH (Redesigned with Cap icon) ══ */
.splash{position:fixed;inset:0;z-index:9999;background:
  radial-gradient(ellipse at 20% 0%,rgba(56,189,248,.18) 0%,transparent 50%),
  radial-gradient(ellipse at 80% 100%,rgba(139,92,246,.18) 0%,transparent 50%),
  linear-gradient(160deg,#0a0e1a 0%,#0a1628 50%,#050810 100%);
  display:grid;place-items:center;overflow:hidden;transition:opacity .6s,visibility .6s}
.splash.gone{opacity:0;visibility:hidden;pointer-events:none}

.splash-grid-bg{position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(56,189,248,.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(56,189,248,.05) 1px,transparent 1px);
  background-size:48px 48px;
  mask-image:radial-gradient(circle at center,black 20%,transparent 70%);
  -webkit-mask-image:radial-gradient(circle at center,black 20%,transparent 70%);
  animation:gridMove 25s linear infinite}
@keyframes gridMove{from{background-position:0 0}to{background-position:48px 48px}}

.splash-glow{position:absolute;border-radius:50%;filter:blur(80px);pointer-events:none}
.glow-1{width:500px;height:500px;background:radial-gradient(circle,rgba(14,165,233,.5),transparent 70%);top:-20%;right:-15%;animation:glowFloat 10s ease-in-out infinite}
.glow-2{width:400px;height:400px;background:radial-gradient(circle,rgba(139,92,246,.4),transparent 70%);bottom:-20%;left:-15%;animation:glowFloat 12s ease-in-out infinite reverse}
.glow-3{width:300px;height:300px;background:radial-gradient(circle,rgba(6,182,212,.3),transparent 70%);top:40%;left:50%;animation:glowFloat 14s ease-in-out infinite}
@keyframes glowFloat{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,-40px) scale(1.15)}}

.splash-content{position:relative;z-index:2;text-align:center;color:#fff;padding:24px;max-width:420px}
.splash-cap-wrap{position:relative;width:150px;height:150px;margin:0 auto 28px;display:grid;place-items:center}

/* Animated glow rings */
.cap-ring{position:absolute;border-radius:50%;border:1.5px solid;pointer-events:none}
.cap-ring.r1{inset:0;border-color:rgba(56,189,248,.4);animation:ringPulse 2.8s ease-out infinite}
.cap-ring.r2{inset:-15px;border-color:rgba(56,189,248,.2);animation:ringPulse 2.8s ease-out infinite .4s}
.cap-ring.r3{inset:-30px;border-color:rgba(139,92,246,.15);animation:ringPulse 2.8s ease-out infinite .8s}
@keyframes ringPulse{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.4);opacity:0}}

.cap-orbit{position:absolute;inset:0;animation:orbit 8s linear infinite}
.cap-orbit-dot{position:absolute;top:-4px;left:50%;transform:translateX(-50%);width:8px;height:8px;border-radius:50%;background:radial-gradient(circle,#38bdf8,#0284c7);box-shadow:0 0 12px #38bdf8,0 0 24px rgba(56,189,248,.5)}
.cap-orbit-2{position:absolute;inset:-20px;animation:orbit 12s linear infinite reverse}
.cap-orbit-2 .cap-orbit-dot{background:radial-gradient(circle,#a78bfa,#7c3aed);box-shadow:0 0 12px #a78bfa,0 0 24px rgba(167,139,250,.5);width:6px;height:6px}
@keyframes orbit{from{transform:rotate(0)}to{transform:rotate(360deg)}}

.cap-box{
  width:96px;height:96px;border-radius:28px;
  background:linear-gradient(135deg,#0ea5e9 0%,#06b6d4 45%,#0891b2 100%);
  display:grid;place-items:center;
  box-shadow:
    0 0 60px rgba(14,165,233,.7),
    0 24px 60px rgba(8,145,178,.5),
    inset 0 2px 0 rgba(255,255,255,.35),
    inset 0 -2px 0 rgba(0,0,0,.1);
  position:relative;z-index:2;
  animation:capBounce 1.2s cubic-bezier(.2,.9,.4,1.3);
}
@keyframes capBounce{0%{transform:scale(0) rotateY(-360deg);opacity:0}60%{transform:scale(1.1) rotateY(0);opacity:1}100%{transform:scale(1);opacity:1}}
.cap-box::before{content:"";position:absolute;inset:2px;border-radius:26px;background:linear-gradient(135deg,rgba(255,255,255,.25),transparent 55%);pointer-events:none}
.cap-box svg{width:52px;height:52px;color:#fff;filter:drop-shadow(0 4px 12px rgba(0,0,0,.35));animation:capFloat 3.5s ease-in-out infinite}
@keyframes capFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

.splash-brand{font-size:26px;font-weight:900;letter-spacing:-.5px;margin-bottom:10px;background:linear-gradient(135deg,#fff 0%,#bae6fd 60%,#a78bfa 100%);-webkit-background-clip:text;background-clip:text;color:transparent;animation:up .8s .3s both}
.splash-tagline{font-size:12.5px;color:rgba(186,230,253,.7);font-weight:700;letter-spacing:.5px;margin-bottom:30px;animation:up .8s .45s both}
@keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}

.splash-progress{width:200px;height:4px;background:rgba(56,189,248,.15);border-radius:99px;overflow:hidden;margin:0 auto;position:relative;animation:up .8s .55s both}
.splash-progress::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(56,189,248,.5),transparent);animation:shimmer 2s linear infinite}
@keyframes shimmer{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.splash-progress i{display:block;height:100%;background:linear-gradient(90deg,#0ea5e9,#06b6d4,#67e8f9);border-radius:99px;box-shadow:0 0 12px #38bdf8;animation:loadBar 2.4s cubic-bezier(.4,0,.2,1) forwards}
@keyframes loadBar{0%{width:0}100%{width:100%}}

.splash-status{margin-top:16px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:11px;color:rgba(148,163,184,.75);font-weight:700;letter-spacing:.5px;animation:up .8s .7s both;font-family:'Space Grotesk',monospace;text-transform:uppercase}
.splash-status-dot{width:6px;height:6px;border-radius:50%;background:#38bdf8;animation:statusPulse 1.2s ease-in-out infinite}
@keyframes statusPulse{0%,100%{opacity:.4;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}

.splash-ver{position:absolute;bottom:calc(22px + var(--safe-bot));left:0;right:0;text-align:center;color:rgba(100,116,139,.5);font-size:9.5px;font-weight:700;letter-spacing:1.5px;font-family:'Space Grotesk',monospace;animation:up .8s .85s both}

/* ══ LAYOUT ══ */
.app{min-height:100vh;display:flex;flex-direction:column;padding-bottom:calc(66px + var(--safe-bot))}
.wrap{max-width:920px;width:100%;margin:0 auto;padding:var(--sp-4)}

/* ══ TOPBAR ══ */
.tb{position:sticky;top:0;z-index:30;padding:calc(var(--sp-2) + var(--safe-top)) var(--sp-4) var(--sp-2);display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.tb-brand{display:flex;align-items:center;gap:var(--sp-2);min-width:0}
.tb-logo{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex-shrink:0;background:linear-gradient(135deg,var(--brand),var(--accent));color:#fff;box-shadow:var(--sh-brand);transition:transform .15s}
.tb-logo:active{transform:scale(.9)}
.tb-logo svg{width:16px;height:16px}
.tb-brand-txt{min-width:0}
.tb-brand-txt b{display:block;font-size:12px;font-weight:900;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.tb-brand-txt small{display:block;font-size:9px;color:var(--text-3);font-weight:700;margin-top:1px}
.tb-actions{display:flex;gap:6px;align-items:center}
.ib{width:30px;height:30px;border-radius:9px;background:var(--surface);color:var(--text-2);border:1px solid var(--border);display:grid;place-items:center;box-shadow:var(--sh-xs);transition:.15s;position:relative}
.ib:active{transform:scale(.92);background:var(--brand-soft);color:var(--brand);border-color:var(--brand)}
.ib svg{width:14px;height:14px}
.ib-dot{position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--danger);border:1.5px solid var(--surface);box-shadow:0 0 6px var(--danger)}
.av-btn{width:30px;height:30px;border-radius:50%;overflow:hidden;background:var(--surface-2);border:2px solid var(--surface);box-shadow:var(--sh-sm);padding:0}
.av-btn img{width:100%;height:100%;object-fit:cover;display:block}

/* ══ BOTTOM NAV ══ */
.bn{position:fixed;bottom:0;left:0;right:0;z-index:30;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(24px);border-top:1px solid var(--border);display:flex;padding:var(--sp-2) var(--sp-2) calc(var(--sp-2) + var(--safe-bot));box-shadow:0 -4px 20px rgba(10,22,40,.06)}
.bn-item{flex:1;background:none;color:var(--text-3);padding:var(--sp-2) var(--sp-1);border-radius:var(--r-2);font-size:9px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;transition:.2s}
.bn-item svg{width:18px;height:18px;transition:transform .2s}
.bn-item.active{color:var(--brand)}
.bn-item.active svg{transform:scale(1.1)}
.bn-item.active::before{content:"";position:absolute;top:-2px;left:50%;transform:translateX(-50%);width:22px;height:3px;background:var(--brand);border-radius:0 0 4px 4px;box-shadow:0 2px 8px var(--brand-glow)}

/* ══ BUTTONS ══ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 13px;border-radius:var(--r-2);font-weight:800;font-size:11.5px;line-height:1.2;transition:.15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn svg{width:13px;height:13px;flex-shrink:0}
.btn-primary{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;box-shadow:var(--sh-brand)}
.btn-outline{background:var(--surface);color:var(--text-2);border:1.5px solid var(--border-s)}
.btn-outline:hover{border-color:var(--brand);color:var(--brand)}
.btn-danger{background:var(--danger-soft);color:var(--danger);border:1px solid color-mix(in srgb,var(--danger) 25%,transparent)}
.btn-success{background:var(--success-soft);color:var(--success);border:1px solid color-mix(in srgb,var(--success) 25%,transparent)}
.btn-warn{background:var(--warning-soft);color:#92400e;border:1px solid color-mix(in srgb,var(--warning) 25%,transparent)}
.btn-purple{background:var(--purple-soft);color:var(--purple);border:1px solid color-mix(in srgb,var(--purple) 25%,transparent)}
.btn-gold{background:var(--gold-soft);color:#92400e;border:1px solid color-mix(in srgb,var(--gold) 30%,transparent)}
.btn-sm{padding:5px 9px;font-size:10.5px}
.btn-sm svg{width:11px;height:11px}
.btn-xs{padding:4px 7px;font-size:9.5px;border-radius:6px}
.btn-xs svg{width:10px;height:10px}
.btn-block{width:100%}
.btn-row{display:flex;gap:6px;flex-wrap:wrap}

/* ══ CARDS & INPUTS ══ */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-3);box-shadow:var(--sh-xs)}
.card-pad{padding:var(--sp-4)}
.inp{width:100%;background:var(--surface-2);border:1.5px solid var(--border);color:var(--text);border-radius:var(--r-2);padding:10px 12px;font-size:12.5px;font-weight:600;transition:.15s}
.inp:focus{border-color:var(--brand);background:var(--surface);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 15%,transparent)}
textarea.inp{resize:vertical;min-height:60px;line-height:1.6}
.field{display:flex;flex-direction:column;gap:6px}
.field>label{font-size:10.5px;color:var(--text-2);font-weight:800}
.field.full{grid-column:1/-1}

/* ══ HERO ══ */
.hero{padding:var(--sp-5) var(--sp-5);border-radius:var(--r-4);margin-bottom:var(--sp-4);position:relative;overflow:hidden;background:
  radial-gradient(ellipse at top right,rgba(56,189,248,.25),transparent 50%),
  radial-gradient(ellipse at bottom left,rgba(139,92,246,.2),transparent 50%),
  linear-gradient(135deg,#0a1628 0%,#0f1e3a 50%,#0a1628 100%);
  color:#fff;box-shadow:var(--sh-lg);border:1px solid rgba(56,189,248,.15)}
.hero::before{content:"";position:absolute;inset:0;background-image:
  linear-gradient(rgba(56,189,248,.04) 1px,transparent 1px),
  linear-gradient(90deg,rgba(56,189,248,.04) 1px,transparent 1px);
  background-size:32px 32px;mask-image:radial-gradient(circle at 70% 30%,black,transparent 70%);
  -webkit-mask-image:radial-gradient(circle at 70% 30%,black,transparent 70%);pointer-events:none}
.hero-inner{position:relative;z-index:1}
.hero-eyebrow{display:inline-flex;align-items:center;gap:5px;background:rgba(56,189,248,.15);border:1px solid rgba(56,189,248,.3);color:#bae6fd;padding:4px 10px;border-radius:var(--r-f);font-size:10px;font-weight:800}
.hero-eyebrow svg{width:11px;height:11px}
.hero h1{font-size:clamp(18px,3.3vw,24px);margin:var(--sp-3) 0 var(--sp-2);line-height:1.3;font-weight:900;color:#fff;letter-spacing:-.4px}
.hero h1 span{background:linear-gradient(90deg,#38bdf8,#67e8f9);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:rgba(186,230,253,.75);line-height:1.65;font-size:11.5px;margin-bottom:var(--sp-4);font-weight:500}
.hero-actions{display:flex;gap:6px;flex-wrap:wrap}
.hero-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:var(--sp-4);padding-top:var(--sp-4);border-top:1px solid rgba(56,189,248,.15);position:relative;z-index:1}
.hero-stat{text-align:center}
.hero-stat b{display:block;font-size:17px;font-weight:900;color:#67e8f9;line-height:1}
.hero-stat small{display:block;font-size:9.5px;color:rgba(186,230,253,.6);margin-top:3px;font-weight:700}

.sec-h{display:flex;align-items:center;justify-content:space-between;margin:var(--sp-4) var(--sp-1) var(--sp-3)}
.sec-h h2{margin:0;font-size:13.5px;font-weight:900;display:flex;align-items:center;gap:6px;letter-spacing:-.2px}
.sec-h h2 svg{width:15px;height:15px;color:var(--brand)}
.sec-h span{color:var(--text-3);font-size:10.5px;font-weight:700}

/* ══ SUBJECTS ══ */
.sub-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--sp-3)}
@media(max-width:480px){.sub-grid{grid-template-columns:1fr}}
.sub{padding:var(--sp-4);border-radius:var(--r-3);background:var(--surface);border:1px solid var(--border);box-shadow:var(--sh-xs);cursor:pointer;transition:.25s;position:relative;overflow:hidden}
.sub:hover{border-color:var(--brand);transform:translateY(-3px);box-shadow:var(--sh-md)}
.sub::after{content:"";position:absolute;top:-30px;right:-30px;width:100px;height:100px;border-radius:50%;background:radial-gradient(circle,var(--brand-soft),transparent 70%);opacity:.6}
.sub-ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,var(--brand-soft),color-mix(in srgb,var(--accent) 20%,var(--surface)));color:var(--brand);margin-bottom:var(--sp-3);position:relative;z-index:1}
.sub-ic svg{width:19px;height:19px}
.sub h3{font-size:13px;font-weight:900;margin-bottom:3px;position:relative;z-index:1}
.sub p{font-size:10.5px;color:var(--text-3);margin-bottom:var(--sp-3);line-height:1.5;position:relative;z-index:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sub-foot{display:flex;justify-content:space-between;align-items:center;font-size:9.5px;font-weight:800;color:var(--text-3);position:relative;z-index:1}
.sub-foot .arrow{color:var(--brand);font-weight:900;font-size:11px}

.search-wrap{position:relative;margin-bottom:var(--sp-3)}
.search-wrap svg{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:13px;height:13px;color:var(--text-3);pointer-events:none}
.search-wrap input{padding-right:34px}

/* ══ UNITS ══ */
.unit{margin-bottom:var(--sp-3);border-radius:var(--r-3);background:var(--surface);border:1px solid var(--border);overflow:hidden;box-shadow:var(--sh-xs)}
.unit-h{display:flex;align-items:center;justify-content:space-between;padding:10px var(--sp-4);background:var(--surface-2);border-bottom:1px solid var(--border)}
.unit-h-l{display:flex;gap:10px;align-items:center}
.unit-num{width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,var(--brand),var(--accent));color:#fff;display:grid;place-items:center;font-weight:900;font-size:11px;flex-shrink:0}
.unit-h-l b{font-size:12px;font-weight:800}
.unit-h-l small{color:var(--text-3);font-size:9.5px;font-weight:700;display:block;margin-top:1px}
.lessons{padding:6px}
.lesson{display:flex;align-items:center;gap:10px;padding:10px;border-radius:var(--r-2);transition:.15s;cursor:pointer}
.lesson:hover{background:var(--surface-2)}
.lesson-ic{width:26px;height:26px;border-radius:7px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex-shrink:0}
.lesson-ic svg{width:12px;height:12px}
.lesson-info{flex:1;min-width:0}
.lesson-info b{font-size:11.5px;font-weight:800;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lesson-info small{font-size:9.5px;color:var(--text-3);font-weight:600}

/* ══ MODAL ══ */
.modal{position:fixed;inset:0;z-index:100;background:rgba(10,22,40,.65);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:var(--sp-3)}
.modal.show{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal-box{width:min(560px,100%);max-height:90vh;overflow-y:auto;background:var(--surface);border-radius:var(--r-5);padding:var(--sp-5);box-shadow:var(--sh-xl);animation:modalUp .3s cubic-bezier(.2,.9,.4,1.1)}
@keyframes modalUp{from{transform:translateY(30px) scale(.94);opacity:0}to{transform:none;opacity:1}}
.modal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--sp-4)}
.modal-h h3{font-size:14px;font-weight:900;display:flex;align-items:center;gap:6px}
.modal-h h3 svg{width:16px;height:16px;color:var(--brand)}

/* ══ TOAST ══ */
.toast{position:fixed;bottom:calc(82px + var(--safe-bot));left:50%;transform:translateX(-50%) translateY(30px);z-index:200;background:#0a1628;color:#fff;padding:10px 16px;border-radius:var(--r-2);font-weight:800;font-size:11px;opacity:0;pointer-events:none;transition:.3s;box-shadow:var(--sh-lg);max-width:90vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{background:linear-gradient(135deg,#16a34a,#22c55e)}
.toast.err{background:linear-gradient(135deg,#dc2626,#ef4444)}

.empty{text-align:center;padding:34px 18px;color:var(--text-3);background:var(--surface);border:1.5px dashed var(--border-s);border-radius:var(--r-3);font-weight:700;font-size:11.5px;line-height:1.8}
.empty svg{width:34px;height:34px;color:var(--border-s);margin:0 auto var(--sp-3)}
.empty-sm{text-align:center;padding:var(--sp-4);color:var(--text-3);font-size:11px;font-weight:700}

/* ══ AUTH (Redesigned) ══ */
.auth{min-height:100vh;display:grid;place-items:center;padding:var(--sp-4);padding-top:calc(var(--sp-4) + var(--safe-top));padding-bottom:calc(var(--sp-4) + var(--safe-bot));background:
  radial-gradient(circle at 15% 15%,color-mix(in srgb,var(--brand) 15%,transparent),transparent 45%),
  radial-gradient(circle at 85% 85%,color-mix(in srgb,var(--purple) 12%,transparent),transparent 45%),
  var(--bg);position:relative;overflow:hidden}
.auth-grid{position:absolute;inset:0;background-image:
  linear-gradient(var(--border) 1px,transparent 1px),
  linear-gradient(90deg,var(--border) 1px,transparent 1px);
  background-size:32px 32px;mask-image:radial-gradient(circle at center,transparent 40%,black 90%);
  -webkit-mask-image:radial-gradient(circle at center,transparent 40%,black 90%);opacity:.5}
.auth-box{width:min(440px,100%);background:var(--surface);border-radius:var(--r-5);box-shadow:var(--sh-xl);border:1px solid var(--border);overflow:hidden;position:relative;z-index:1;animation:authIn .55s cubic-bezier(.2,.9,.4,1.1)}
@keyframes authIn{from{opacity:0;transform:translateY(20px) scale(.96)}to{opacity:1;transform:none}}

.auth-header{padding:26px 22px 18px;text-align:center;position:relative;overflow:hidden;background:
  radial-gradient(ellipse at 30% 20%,rgba(56,189,248,.35),transparent 55%),
  radial-gradient(ellipse at 70% 80%,rgba(139,92,246,.3),transparent 55%),
  linear-gradient(160deg,#0a1628 0%,#122040 50%,#0e7490 100%);
  color:#fff}
.auth-header::before{content:"";position:absolute;inset:0;background-image:
  linear-gradient(rgba(56,189,248,.08) 1px,transparent 1px),
  linear-gradient(90deg,rgba(56,189,248,.08) 1px,transparent 1px);
  background-size:24px 24px;mask-image:radial-gradient(circle at 50% 40%,black,transparent 75%);
  -webkit-mask-image:radial-gradient(circle at 50% 40%,black,transparent 75%);pointer-events:none}
.auth-header-inner{position:relative;z-index:1}
.auth-lottie{width:130px;height:130px;margin:0 auto var(--sp-2);position:relative}
.auth-title{font-size:19px;font-weight:900;color:#fff;margin-bottom:6px;letter-spacing:-.4px}
.auth-subtitle{font-size:11.5px;color:rgba(186,230,253,.75);font-weight:600;line-height:1.7;max-width:300px;margin:0 auto}
.auth-body{padding:var(--sp-5)}

.step-dots{display:flex;justify-content:center;gap:5px;padding:var(--sp-3) 0 0}
.step-dot{width:6px;height:6px;border-radius:50%;background:var(--border-s);transition:.3s}
.step-dot.active{width:22px;border-radius:var(--r-f);background:linear-gradient(90deg,var(--brand),var(--accent));box-shadow:0 0 8px var(--brand-glow)}
.step-dot.done{background:var(--success)}

.grade-list{display:grid;gap:10px;margin-bottom:var(--sp-4)}
.grade-card{padding:var(--sp-3) var(--sp-4);border-radius:var(--r-3);background:var(--surface);border:2px solid var(--border);cursor:pointer;transition:.2s;text-align:right;position:relative;overflow:hidden}
.grade-card:hover{border-color:var(--brand);transform:translateY(-2px);box-shadow:var(--sh-md)}
.grade-card.sel{border-color:var(--brand);background:linear-gradient(135deg,var(--brand-soft),var(--surface));box-shadow:0 8px 24px var(--brand-glow)}
.grade-head{display:flex;align-items:center;gap:var(--sp-3);position:relative;z-index:1}
.grade-ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#fff;flex-shrink:0;box-shadow:0 6px 16px rgba(0,0,0,.15)}
.grade-ic svg{width:21px;height:21px}
.grade-card.sci .grade-ic{background:linear-gradient(135deg,#0ea5e9,#06b6d4)}
.grade-card.lit .grade-ic{background:linear-gradient(135deg,#8b5cf6,#a855f7)}
.grade-card.ninth .grade-ic{background:linear-gradient(135deg,#f59e0b,#fbbf24)}
.grade-info{flex:1;min-width:0}
.grade-info b{display:block;font-size:13px;font-weight:900;margin-bottom:2px}
.grade-info small{display:block;font-size:10.5px;color:var(--text-3);font-weight:600;line-height:1.4}
.grade-check{width:22px;height:22px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;flex-shrink:0;opacity:0;transform:scale(.5);transition:.2s}
.grade-card.sel .grade-check{opacity:1;transform:scale(1)}
.grade-check svg{width:12px;height:12px}

.feat-list{display:grid;gap:8px;margin-bottom:var(--sp-4)}
.feat-item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:var(--r-2);background:var(--surface-2);border:1px solid var(--border);transition:.2s}
.feat-ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex-shrink:0;color:#fff}
.feat-ic svg{width:16px;height:16px}
.feat-ic.t{background:linear-gradient(135deg,#0ea5e9,#06b6d4)}
.feat-ic.g{background:linear-gradient(135deg,#16a34a,#22c55e)}
.feat-ic.o{background:linear-gradient(135deg,#f59e0b,#fbbf24)}
.feat-ic.p{background:linear-gradient(135deg,#8b5cf6,#a855f7)}
.feat-ic.pk{background:linear-gradient(135deg,#ec4899,#f472b6)}
.feat-ic.gd{background:linear-gradient(135deg,#eab308,#facc15)}
.feat-body{flex:1;min-width:0}
.feat-body b{display:block;font-size:12px;font-weight:900;margin-bottom:2px}
.feat-body small{display:block;font-size:10px;color:var(--text-3);font-weight:600;line-height:1.5}

.float-field{position:relative;margin-bottom:var(--sp-4)}
.float-field input{width:100%;background:var(--surface-2);border:1.5px solid var(--border);border-radius:var(--r-3);padding:20px 14px 8px;font-size:14px;font-weight:700;transition:.15s}
.float-field input:focus{border-color:var(--brand);background:var(--surface);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 12%,transparent)}
.float-field label{position:absolute;right:14px;top:8px;font-size:9.5px;color:var(--text-3);font-weight:800;letter-spacing:.4px;text-transform:uppercase;pointer-events:none;transition:.15s}
.float-field input:focus+label{color:var(--brand)}

.live-preview{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-3);padding:10px;margin-bottom:var(--sp-4)}
.live-av{width:48px;height:48px;border-radius:50%;overflow:hidden;flex-shrink:0;background:linear-gradient(135deg,var(--brand-soft),var(--surface));border:2.5px solid var(--surface);box-shadow:var(--sh-sm)}
.live-av img{width:100%;height:100%;object-fit:cover}
.live-info{flex:1;min-width:0}
.live-info b{display:block;font-size:13px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live-info small{display:block;font-size:10px;color:var(--text-3);font-weight:600;margin-top:1px}

.invite-input{text-align:center;font-family:'Space Grotesk',monospace;font-size:20px;letter-spacing:6px;font-weight:800;text-transform:uppercase;direction:ltr}

.auth-primary{width:100%;padding:14px;border-radius:var(--r-3);background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;font-weight:900;font-size:13.5px;box-shadow:var(--sh-brand);display:flex;align-items:center;justify-content:center;gap:6px;transition:.15s;letter-spacing:.2px}
.auth-primary:active{transform:scale(.98)}
.auth-primary:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.auth-primary svg{width:16px;height:16px}

.nav-row{display:flex;gap:6px}
.nav-row .auth-primary{flex:1}

.auth-note{color:var(--text-3);font-size:9.5px;margin-top:var(--sp-4);line-height:1.65;font-weight:600;display:flex;align-items:flex-start;gap:5px;text-align:right}
.auth-note svg{width:11px;height:11px;flex-shrink:0;margin-top:2px;color:var(--brand)}

/* ══ QUIZ ══ */
.quiz-top{padding:var(--sp-3) var(--sp-4);border-radius:var(--r-3);background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;margin-bottom:var(--sp-3);box-shadow:var(--sh-brand);position:relative;overflow:hidden}
.quiz-top::before{content:"";position:absolute;top:-50%;left:-20%;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.2),transparent 60%)}
.quiz-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;position:relative;z-index:1}
.quiz-row b{font-size:12.5px;font-weight:900;display:block}
.quiz-row small{font-size:10px;font-weight:600;opacity:.85;display:block;margin-top:2px}
.timer{padding:5px 10px;border-radius:9px;background:rgba(255,255,255,.2);color:#fff;font-weight:900;font-size:11.5px;display:flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums;backdrop-filter:blur(8px)}
.timer svg{width:11px;height:11px}
.timer.warn{background:var(--danger);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.quiz-bar{height:4px;border-radius:var(--r-f);background:rgba(255,255,255,.25);overflow:hidden;position:relative;z-index:1}
.quiz-bar i{display:block;height:100%;background:#fff;border-radius:var(--r-f);transition:.3s}

.q-card{padding:var(--sp-4);border-radius:var(--r-3);background:var(--surface);border:1px solid var(--border);box-shadow:var(--sh-sm);margin-bottom:var(--sp-3)}
.q-meta{display:flex;justify-content:space-between;font-size:10px;font-weight:800;color:var(--text-3);margin-bottom:10px}
.q-chip{padding:3px 8px;border-radius:var(--r-f);background:var(--brand-soft);color:var(--brand)}
.q-text{font-size:14px;line-height:1.7;font-weight:800;margin-bottom:var(--sp-4);letter-spacing:-.2px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;align-items:center;gap:10px;text-align:right;padding:11px 12px;border-radius:var(--r-2);background:var(--surface-2);border:1.5px solid var(--border);font-size:12px;font-weight:700;line-height:1.5;transition:.15s;color:var(--text)}
.opt:hover:not(:disabled){border-color:var(--brand);background:var(--brand-soft)}
.opt.sel{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-2);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 15%,transparent)}
.opt.ok{border-color:var(--success);background:var(--success-soft);color:var(--success)}
.opt.no{border-color:var(--danger);background:var(--danger-soft);color:var(--danger)}
.opt:disabled{cursor:default}
.opt-badge{min-width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:var(--surface);color:var(--text-3);font-weight:900;font-size:11px;border:1px solid var(--border);flex-shrink:0}
.opt.sel .opt-badge,.opt.ok .opt-badge,.opt.no .opt-badge{background:currentColor;color:#fff;border-color:transparent}
.opt-tag{margin-right:auto;width:14px;height:14px}

.fb{margin-top:10px;padding:11px 13px;border-radius:var(--r-2);font-size:11.5px;font-weight:700;display:flex;gap:10px;align-items:flex-start;line-height:1.6}
.fb svg{width:15px;height:15px;flex-shrink:0;margin-top:2px}
.fb.ok{background:var(--success-soft);color:var(--success);border:1px solid color-mix(in srgb,var(--success) 25%,transparent)}
.fb.no{background:var(--danger-soft);color:var(--danger);border:1px solid color-mix(in srgb,var(--danger) 25%,transparent)}

.result{padding:var(--sp-5);text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-5);box-shadow:var(--sh-sm)}
.res-ring{width:130px;height:130px;border-radius:50%;display:grid;place-items:center;margin:0 auto var(--sp-4);position:relative}
.res-ring::after{content:"";position:absolute;inset:9px;background:var(--surface);border-radius:50%}
.res-ring-inner{position:relative;z-index:1;text-align:center}
.res-ring-inner b{display:block;font-size:28px;font-weight:900;letter-spacing:-1.2px}
.res-ring-inner small{font-size:9.5px;color:var(--text-3);font-weight:700}
.result h2{font-size:17px;font-weight:900;margin:var(--sp-3) 0 var(--sp-2)}
.result p{color:var(--text-3);font-size:11.5px;line-height:1.7;font-weight:600}

/* ══ QUIZ CONFIG ══ */
.qconfig-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:var(--r-2);background:var(--surface-2);border:1px solid var(--border);margin-bottom:6px}
.qconfig-row .lbl{flex:1;min-width:0}
.qconfig-row .lbl b{display:block;font-size:11.5px;font-weight:800;margin-bottom:2px}
.qconfig-row .lbl small{display:block;font-size:10px;color:var(--text-3);font-weight:600}
.switch{position:relative;width:38px;height:22px;background:var(--border-s);border-radius:var(--r-f);transition:.25s;flex-shrink:0;cursor:pointer}
.switch::after{content:"";position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.25s;box-shadow:var(--sh-sm)}
.switch.on{background:var(--brand)}
.switch.on::after{transform:translateX(-16px)}

.lesson-picker{max-height:220px;overflow-y:auto;padding:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-2)}
.lesson-pick-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:7px;cursor:pointer;transition:.15s}
.lesson-pick-item:hover{background:var(--surface-3)}
.lesson-pick-item input{width:16px;height:16px;accent-color:var(--brand);flex-shrink:0}
.lesson-pick-item label{flex:1;font-size:11.5px;font-weight:700;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lesson-pick-item .count{font-size:10px;color:var(--text-3);font-weight:700;flex-shrink:0;background:var(--surface);padding:2px 7px;border-radius:var(--r-f)}

.time-preset-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:6px}
.time-preset{padding:10px 6px;border-radius:var(--r-2);background:var(--surface-2);border:1.5px solid var(--border);text-align:center;font-size:11.5px;font-weight:800;transition:.15s;cursor:pointer}
.time-preset:hover{border-color:var(--brand)}
.time-preset.sel{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}

/* ══ PROFILE (Fully Redesigned) ══ */
.profile-hero{
  padding:var(--sp-5) var(--sp-5) var(--sp-4);
  border-radius:var(--r-4);
  background:
    radial-gradient(ellipse at top right,rgba(56,189,248,.3),transparent 55%),
    radial-gradient(ellipse at bottom left,rgba(139,92,246,.25),transparent 55%),
    linear-gradient(135deg,#0a1628 0%,#122040 50%,#0a1628 100%);
  color:#fff;margin-bottom:var(--sp-3);position:relative;overflow:hidden;
  box-shadow:var(--sh-lg);border:1px solid rgba(56,189,248,.15)
}
.profile-hero::before{content:"";position:absolute;inset:0;background-image:
  linear-gradient(rgba(56,189,248,.05) 1px,transparent 1px),
  linear-gradient(90deg,rgba(56,189,248,.05) 1px,transparent 1px);
  background-size:24px 24px;mask-image:radial-gradient(circle at 70% 30%,black,transparent 70%);
  -webkit-mask-image:radial-gradient(circle at 70% 30%,black,transparent 70%);pointer-events:none}

.profile-hero-inner{position:relative;z-index:1;display:flex;align-items:center;gap:var(--sp-4)}
.profile-av-wrap{position:relative;flex-shrink:0}
.profile-av{width:76px;height:76px;border-radius:50%;overflow:hidden;background:rgba(56,189,248,.15);border:3px solid rgba(56,189,248,.5);box-shadow:0 8px 24px rgba(0,0,0,.35),0 0 40px rgba(56,189,248,.3)}
.profile-av img{width:100%;height:100%;object-fit:cover}
.profile-av-badge{position:absolute;bottom:-4px;right:-4px;background:linear-gradient(135deg,#eab308,#facc15);color:#78350f;padding:3px 8px;border-radius:var(--r-f);font-size:10px;font-weight:900;border:2px solid #0a1628;box-shadow:0 4px 12px rgba(234,179,8,.5)}
.profile-info{min-width:0;flex:1}
.profile-info h2{font-size:19px;font-weight:900;margin-bottom:5px;letter-spacing:-.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profile-meta{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:10.5px;font-weight:700;color:rgba(186,230,253,.85)}
.profile-meta span{display:flex;align-items:center;gap:4px}
.profile-meta svg{width:11px;height:11px}

.profile-xp{margin-top:var(--sp-4);padding-top:var(--sp-4);border-top:1px solid rgba(56,189,248,.15);position:relative;z-index:1}
.xp-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:10.5px;font-weight:800;color:rgba(186,230,253,.85)}
.xp-bar{height:8px;background:rgba(56,189,248,.15);border-radius:var(--r-f);overflow:hidden;position:relative}
.xp-bar i{display:block;height:100%;background:linear-gradient(90deg,#38bdf8,#a78bfa);border-radius:var(--r-f);transition:.6s;box-shadow:0 0 12px rgba(56,189,248,.6)}

.profile-quick-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:var(--sp-4);padding-top:var(--sp-4);border-top:1px solid rgba(56,189,248,.15);position:relative;z-index:1}
.qs-item{text-align:center}
.qs-ic{width:26px;height:26px;border-radius:8px;margin:0 auto 5px;display:grid;place-items:center;background:rgba(56,189,248,.15);color:#67e8f9}
.qs-ic svg{width:12px;height:12px}
.qs-item b{display:block;font-size:15px;font-weight:900;letter-spacing:-.3px;color:#fff}
.qs-item small{display:block;font-size:9px;color:rgba(186,230,253,.6);font-weight:700;margin-top:2px}

/* Profile cards - compact */
.pf-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-3);padding:var(--sp-4);margin-bottom:var(--sp-3);box-shadow:var(--sh-xs)}
.pf-card-title{font-size:12.5px;font-weight:900;margin-bottom:var(--sp-3);display:flex;align-items:center;gap:6px;letter-spacing:-.2px}
.pf-card-title svg{width:14px;height:14px;color:var(--brand)}

/* Mini stat tiles */
.stat-tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat-tile{padding:12px;border-radius:var(--r-2);text-align:center;position:relative;overflow:hidden}
.stat-tile.lesson{background:linear-gradient(135deg,var(--brand-soft),var(--surface));border:1px solid color-mix(in srgb,var(--brand) 30%,transparent)}
.stat-tile.ref{background:linear-gradient(135deg,var(--gold-soft),var(--surface));border:1px solid color-mix(in srgb,var(--gold) 35%,transparent)}
.stat-tile-ic{width:30px;height:30px;border-radius:9px;margin:0 auto 8px;display:grid;place-items:center;color:#fff}
.stat-tile-ic svg{width:15px;height:15px}
.stat-tile.lesson .stat-tile-ic{background:linear-gradient(135deg,var(--brand),var(--accent))}
.stat-tile.ref .stat-tile-ic{background:linear-gradient(135deg,#eab308,#facc15)}
.stat-tile b{display:block;font-size:20px;font-weight:900;letter-spacing:-.4px}
.stat-tile.lesson b{color:var(--brand)}
.stat-tile.ref b{color:#92400e}
.stat-tile small{display:block;font-size:9.5px;color:var(--text-3);font-weight:800;margin-top:3px}

/* Heatmap */
.week-heat{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:10px 0}
.heat-day{text-align:center}
.heat-day-label{font-size:9px;color:var(--text-3);font-weight:800;margin-bottom:4px}
.heat-cell{aspect-ratio:1;border-radius:6px;background:var(--border);transition:.2s;position:relative}
.heat-cell.l1{background:color-mix(in srgb,var(--brand) 25%,var(--border))}
.heat-cell.l2{background:color-mix(in srgb,var(--brand) 50%,var(--border))}
.heat-cell.l3{background:color-mix(in srgb,var(--brand) 75%,var(--border))}
.heat-cell.l4{background:var(--brand);box-shadow:0 0 8px var(--brand-glow)}

/* Mastery compact */
.mastery-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.mastery-item:last-child{border-bottom:0}
.mastery-ic{width:28px;height:28px;border-radius:8px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex-shrink:0}
.mastery-ic svg{width:14px;height:14px}
.mastery-info{flex:1;min-width:0}
.mastery-info b{display:block;font-size:11.5px;font-weight:800;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mastery-bar{height:4px;background:var(--border);border-radius:var(--r-f);overflow:hidden}
.mastery-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--accent));border-radius:var(--r-f);transition:.6s}
.mastery-pct{font-size:10.5px;font-weight:900;color:var(--brand);flex-shrink:0;min-width:34px;text-align:left}

/* Invite compact */
.invite-compact{padding:var(--sp-4);border-radius:var(--r-3);background:linear-gradient(135deg,var(--gold-soft),var(--surface));border:1px solid color-mix(in srgb,var(--gold) 35%,transparent);margin-bottom:var(--sp-3)}
.invite-code-mini{background:var(--surface);border:2px dashed color-mix(in srgb,var(--gold) 45%,transparent);border-radius:var(--r-2);padding:12px;text-align:center;margin-bottom:10px}
.invite-code-mini b{display:block;font-size:18px;font-weight:900;letter-spacing:4px;color:#92400e;font-family:'Space Grotesk',monospace;direction:ltr}

/* Achievements compact */
.badge-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
@media(max-width:420px){.badge-grid{grid-template-columns:repeat(3,1fr)}}
.badge-item{padding:10px 6px;border-radius:10px;text-align:center;background:var(--surface-2);border:1px solid var(--border);transition:.15s}
.badge-item.unlocked{background:linear-gradient(160deg,var(--gold-soft),var(--surface-2));border-color:color-mix(in srgb,var(--gold) 35%,transparent)}
.badge-item.locked{opacity:.55}
.badge-ic{width:26px;height:26px;border-radius:50%;margin:0 auto 5px;display:grid;place-items:center;background:var(--surface);color:var(--text-3);border:1px solid var(--border)}
.badge-item.unlocked .badge-ic{background:linear-gradient(135deg,#eab308,#facc15);color:#fff;border-color:transparent;box-shadow:0 3px 8px rgba(234,179,8,.35)}
.badge-ic svg{width:12px;height:12px}
.badge-item b{display:block;font-size:9.5px;font-weight:900;line-height:1.2}

/* Avatar picker compact */
.av-grid-p{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.av-opt-p{aspect-ratio:1;border-radius:9px;background:var(--surface-2);border:2px solid var(--border);overflow:hidden;padding:0;transition:.15s}
.av-opt-p img{width:100%;height:100%;object-fit:cover;display:block}
.av-opt-p.sel{border-color:var(--brand);transform:scale(1.06);box-shadow:0 4px 12px var(--brand-glow)}

/* Menu grid (compact) */
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.menu-btn{padding:10px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);display:flex;align-items:center;gap:8px;transition:.15s;font-weight:800;font-size:11px;text-align:right}
.menu-btn:hover{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.menu-btn svg{width:14px;height:14px;color:var(--brand);flex-shrink:0}

/* ══ STUDY HUB ══ */
.study-tabs{display:flex;gap:2px;padding:4px;background:var(--surface-2);border-radius:var(--r-3);border:1px solid var(--border);margin-bottom:var(--sp-4);overflow-x:auto;scrollbar-width:none}
.study-tabs::-webkit-scrollbar{display:none}
.study-tab{flex:1;min-width:max-content;padding:8px 10px;text-align:center;background:none;color:var(--text-3);border-radius:9px;font-size:10.5px;font-weight:800;transition:.15s;display:flex;align-items:center;justify-content:center;gap:4px}
.study-tab svg{width:12px;height:12px}
.study-tab.active{background:var(--brand);color:#fff;box-shadow:var(--sh-xs)}

.pomodoro{padding:var(--sp-5) var(--sp-4);border-radius:var(--r-4);background:
  radial-gradient(ellipse at top,rgba(139,92,246,.4),transparent 60%),
  linear-gradient(135deg,#4c1d95,#6d28d9);
  color:#fff;text-align:center;box-shadow:0 12px 32px rgba(139,92,246,.35);position:relative;overflow:hidden;margin-bottom:var(--sp-3)}
.pomodoro::before{content:"";position:absolute;inset:0;background-image:
  linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),
  linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
  background-size:24px 24px;mask-image:radial-gradient(circle at center,black,transparent 70%);
  -webkit-mask-image:radial-gradient(circle at center,black,transparent 70%);pointer-events:none}
.pomodoro-phase{font-size:11px;font-weight:800;opacity:.85;margin-bottom:10px;position:relative;z-index:1;text-transform:uppercase;letter-spacing:1.5px}
.pomodoro-ring{width:160px;height:160px;margin:0 auto var(--sp-4);position:relative;z-index:1}
.pomodoro-ring svg{transform:rotate(-90deg)}
.pomodoro-ring-time{position:absolute;inset:0;display:grid;place-items:center}
.pomodoro-time{font-size:48px;font-weight:900;letter-spacing:-2px;font-family:'Space Grotesk',monospace;font-variant-numeric:tabular-nums;text-shadow:0 4px 20px rgba(0,0,0,.3);line-height:1}
.pomodoro-controls{display:flex;gap:8px;justify-content:center;position:relative;z-index:1}
.pomodoro-controls button{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;display:grid;place-items:center;transition:.15s;border:0}
.pomodoro-controls button:active{transform:scale(.92)}
.pomodoro-controls button.play{width:54px;height:54px;background:rgba(255,255,255,.3)}
.pomodoro-controls button svg{width:20px;height:20px}
.pomodoro-controls button.play svg{width:22px;height:22px}
.pomodoro-controls button.settings{background:rgba(255,255,255,.15)}
.pomodoro-controls button.settings svg{width:18px;height:18px}

.focus-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:var(--sp-3)}
.focus-stat{padding:10px;border-radius:10px;background:var(--surface);border:1px solid var(--border);text-align:center;box-shadow:var(--sh-xs)}
.focus-stat b{display:block;font-size:18px;font-weight:900;letter-spacing:-.4px}
.focus-stat.c1 b{color:var(--brand)}
.focus-stat.c2 b{color:var(--purple)}
.focus-stat.c3 b{color:var(--success)}
.focus-stat small{display:block;font-size:9.5px;color:var(--text-3);font-weight:800;margin-top:2px}

/* Music grid */
.music-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.music-item{padding:12px;border-radius:11px;background:var(--surface);border:1px solid var(--border);text-align:center;cursor:pointer;transition:.15s;box-shadow:var(--sh-xs);position:relative;overflow:hidden}
.music-item:hover{border-color:var(--brand);transform:translateY(-2px)}
.music-item.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.music-item.on::before{content:"";position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--brand);animation:statusPulse 1.2s infinite}
.music-ic{width:36px;height:36px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand)}
.music-item.on .music-ic{background:var(--brand);color:#fff}
.music-ic svg{width:18px;height:18px}
.music-item b{display:block;font-size:11.5px;font-weight:800;margin-bottom:2px}
.music-item small{display:block;font-size:9.5px;color:var(--text-3);font-weight:700}

/* Plan item */
.plan-item{padding:var(--sp-4);border-radius:var(--r-3);background:var(--surface);border:1px solid var(--border);margin-bottom:var(--sp-3);box-shadow:var(--sh-xs);transition:.2s;position:relative;overflow:hidden}
.plan-item::before{content:"";position:absolute;top:0;right:0;width:4px;height:100%;background:linear-gradient(180deg,var(--brand),var(--purple))}
.plan-header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.plan-title{flex:1;min-width:0}
.plan-title b{display:block;font-size:13px;font-weight:900;margin-bottom:3px}
.plan-title small{display:block;font-size:10.5px;color:var(--text-3);font-weight:700}
.plan-progress-bar{height:6px;background:var(--border);border-radius:var(--r-f);overflow:hidden;margin-bottom:10px}
.plan-progress-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--accent));border-radius:var(--r-f);transition:.4s}
.plan-meta{display:flex;flex-wrap:wrap;gap:8px;font-size:10px;color:var(--text-3);font-weight:700;margin-bottom:10px}
.plan-meta span{display:flex;align-items:center;gap:3px}
.plan-meta svg{width:10px;height:10px}
.plan-actions{display:flex;gap:6px;margin-top:10px}
.plan-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.plan-tag{padding:3px 8px;border-radius:var(--r-f);background:var(--brand-soft);color:var(--brand);font-size:9.5px;font-weight:800}
.plan-tag.lesson{background:var(--purple-soft);color:var(--purple)}
.plan-day-checks{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:10px 0}
.plan-day{padding:7px 0;border-radius:7px;background:var(--surface-2);border:1px solid var(--border);text-align:center;font-size:9.5px;font-weight:800;cursor:pointer;transition:.15s}
.plan-day:hover{border-color:var(--brand)}
.plan-day.done{background:var(--success-soft);border-color:var(--success);color:var(--success)}
.plan-day.today{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}

/* Breathing */
.breathing-box{padding:var(--sp-5);border-radius:var(--r-4);background:linear-gradient(135deg,var(--brand-soft),var(--surface));border:1px solid color-mix(in srgb,var(--brand) 25%,transparent);text-align:center}
.breathing-circle{width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,var(--brand),var(--brand-2));margin:var(--sp-4) auto;display:grid;place-items:center;color:#fff;font-weight:900;font-size:13px;box-shadow:0 8px 32px var(--brand-glow);transition:transform 4s ease-in-out;text-align:center;line-height:1.3}
.breathing-circle.inhale{transform:scale(1.3)}
.breathing-circle.exhale{transform:scale(.9)}

/* Notes */
.note-card{padding:var(--sp-3);border-radius:var(--r-2);background:var(--surface-2);border:1px solid var(--border);margin-bottom:8px}
.note-card p{font-size:11.5px;line-height:1.65;white-space:pre-wrap}
.note-meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);font-size:9.5px;color:var(--text-3);font-weight:700}

.row-line{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--surface-2);border-radius:var(--r-2);margin-bottom:6px}
.row-line:last-child{margin-bottom:0}
.row-line .k{font-size:11px;font-weight:800;color:var(--text-3);display:flex;align-items:center;gap:5px}
.row-line .k svg{width:12px;height:12px}
.row-line .v{font-size:11.5px;font-weight:900;color:var(--text)}

.info{padding:10px 12px;border-radius:var(--r-2);font-size:11px;font-weight:600;line-height:1.65;display:flex;gap:8px;align-items:flex-start;background:var(--brand-soft);color:var(--brand-2);border:1px solid color-mix(in srgb,var(--brand) 20%,transparent)}
.info svg{width:13px;height:13px;flex-shrink:0;margin-top:2px}
.info.warn{background:var(--warning-soft);color:#92400e;border-color:color-mix(in srgb,var(--warning) 25%,transparent)}
.info.success{background:var(--success-soft);color:var(--success);border-color:color-mix(in srgb,var(--success) 25%,transparent)}
.info.gold{background:var(--gold-soft);color:#92400e;border-color:color-mix(in srgb,var(--gold) 30%,transparent)}

/* Shop */
.shop-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.shop-item{padding:var(--sp-3);border-radius:var(--r-3);background:var(--surface);border:1px solid var(--border);text-align:center;transition:.15s;cursor:pointer;box-shadow:var(--sh-xs)}
.shop-item:hover{border-color:var(--brand);transform:translateY(-2px)}
.shop-item.owned{border-color:var(--success);background:var(--success-soft)}
.shop-item-ic{width:44px;height:44px;border-radius:12px;margin:0 auto 10px;display:grid;place-items:center;color:#fff;box-shadow:var(--sh-sm)}
.shop-item-ic svg{width:20px;height:20px}
.shop-item b{display:block;font-size:11.5px;font-weight:900;margin-bottom:3px}
.shop-item small{display:block;font-size:9.5px;color:var(--text-3);font-weight:700;margin-bottom:10px}
.shop-item .price{display:inline-flex;align-items:center;gap:3px;padding:4px 10px;border-radius:var(--r-f);background:var(--gold-soft);color:#92400e;font-size:10.5px;font-weight:900}
.shop-item .price svg{width:10px;height:10px}

/* Podium */
.podium{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:8px;align-items:end;margin-bottom:var(--sp-4)}
.pod{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-3);padding:12px 8px;text-align:center;box-shadow:var(--sh-xs);position:relative}
.pod.p1{background:linear-gradient(160deg,var(--gold-soft),var(--surface));border-color:color-mix(in srgb,var(--gold) 40%,transparent);padding:var(--sp-5) 8px}
.pod.p2{background:var(--surface-2)}
.pod.p3{background:linear-gradient(160deg,color-mix(in srgb,#c2692c 14%,var(--surface)),var(--surface))}
.pod-crown{position:absolute;top:-9px;left:50%;transform:translateX(-50%);width:20px;height:20px;color:var(--gold);filter:drop-shadow(0 3px 6px rgba(234,179,8,.5))}
.pod-av{width:44px;height:44px;border-radius:50%;margin:0 auto 8px;overflow:hidden;background:var(--surface-2);border:3px solid var(--surface);box-shadow:var(--sh-sm)}
.pod.p1 .pod-av{width:52px;height:52px;border-color:var(--gold)}
.pod-av img{width:100%;height:100%;object-fit:cover}
.pod b{display:block;font-size:10.5px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.pod-pts{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:var(--r-f);background:var(--brand-soft);color:var(--brand);font-size:9.5px;font-weight:900}
.pod-pts svg{width:9px;height:9px;color:var(--gold)}
.pod.p1 .pod-pts{background:var(--gold-soft);color:#92400e}
.pod-rank{position:absolute;top:6px;right:6px;width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-size:9px;font-weight:900;background:var(--brand);color:#fff}
.pod.p1 .pod-rank{background:var(--gold)}
.pod.p2 .pod-rank{background:#94a3b8}
.pod.p3 .pod-rank{background:#c2692c}

.lb-list{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-3);overflow:hidden;box-shadow:var(--sh-xs)}
.lb-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border)}
.lb-row:last-child{border-bottom:0}
.lb-row.me{background:var(--brand-soft)}
.lb-pos{width:22px;height:22px;border-radius:7px;background:var(--surface-2);color:var(--text-3);display:grid;place-items:center;font-weight:900;font-size:10.5px;flex-shrink:0}
.lb-pos.top{background:var(--gold);color:#fff}
.lb-av{width:28px;height:28px;border-radius:50%;overflow:hidden;background:var(--surface-2);flex-shrink:0}
.lb-av img{width:100%;height:100%;object-fit:cover}
.lb-info{flex:1;min-width:0}
.lb-info b{display:block;font-size:11.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-info small{display:block;font-size:9.5px;color:var(--text-3);font-weight:700}
.lb-pts{font-weight:900;color:var(--brand);font-size:11.5px;display:flex;align-items:center;gap:3px}
.lb-pts svg{width:10px;height:10px;color:var(--gold)}

/* Admin - compact */
.admin-wrap{display:grid;grid-template-columns:180px 1fr;gap:var(--sp-4);align-items:start}
@media(max-width:820px){.admin-wrap{grid-template-columns:1fr}}
.admin-side{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-3);padding:6px;position:sticky;top:76px;box-shadow:var(--sh-xs)}
@media(max-width:820px){.admin-side{position:static;display:flex;overflow-x:auto;gap:4px;padding:6px}.admin-side::-webkit-scrollbar{display:none}}
.admin-side button{width:100%;padding:8px 10px;text-align:right;background:none;color:var(--text-2);border-radius:9px;margin-bottom:2px;font-weight:800;font-size:11px;display:flex;align-items:center;gap:6px;transition:.15s}
@media(max-width:820px){.admin-side button{width:auto;min-width:max-content;margin-bottom:0}}
.admin-side button svg{width:13px;height:13px;flex-shrink:0}
.admin-side button.active{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;box-shadow:var(--sh-brand)}
.admin-main{min-width:0;display:flex;flex-direction:column;gap:10px}

.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:600px){.kpi-grid{grid-template-columns:repeat(2,1fr)}}
.kpi{padding:12px;border-radius:11px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--sh-xs);position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;top:-20px;right:-20px;width:80px;height:80px;border-radius:50%;opacity:.08}
.kpi.c1::after{background:var(--brand)}
.kpi.c2::after{background:var(--success)}
.kpi.c3::after{background:var(--warning)}
.kpi.c4::after{background:var(--purple)}
.kpi-ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;margin-bottom:8px;position:relative;z-index:1}
.kpi-ic svg{width:13px;height:13px}
.kpi.c1 .kpi-ic{background:var(--brand-soft);color:var(--brand)}
.kpi.c2 .kpi-ic{background:var(--success-soft);color:var(--success)}
.kpi.c3 .kpi-ic{background:var(--warning-soft);color:var(--warning)}
.kpi.c4 .kpi-ic{background:var(--purple-soft);color:var(--purple)}
.kpi b{display:block;font-size:20px;font-weight:900;letter-spacing:-.5px;line-height:1;position:relative;z-index:1}
.kpi span{display:block;font-size:10px;color:var(--text-3);font-weight:800;margin-top:3px;position:relative;z-index:1}

.chart-box{padding:12px;border-radius:11px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--sh-xs)}
.chart-box h3{font-size:12px;font-weight:900;margin-bottom:10px;display:flex;align-items:center;gap:5px}
.chart-box h3 svg{width:13px;height:13px;color:var(--brand)}
.chart{display:flex;align-items:flex-end;gap:5px;height:100px;padding:10px 0 6px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.chart .bar{width:100%;background:linear-gradient(180deg,var(--brand),var(--accent));border-radius:4px 4px 0 0;min-height:4px;transition:.4s}
.chart .lbl{font-size:8.5px;color:var(--text-3);font-weight:800}

.tbl-wrap{background:var(--surface);border:1px solid var(--border);border-radius:11px;overflow:hidden;box-shadow:var(--sh-xs)}
.tbl-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:500px}
thead{background:var(--surface-2)}
th{text-align:right;padding:9px 10px;font-size:10px;font-weight:800;color:var(--text-3);border-bottom:1px solid var(--border);white-space:nowrap;text-transform:uppercase}
td{padding:9px 10px;font-size:11.5px;font-weight:700;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
.mono{font-family:'Space Grotesk',monospace;direction:ltr;text-align:right;font-size:10px}

.tag{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:var(--r-f);font-size:9.5px;font-weight:800}
.tag.ok{background:var(--success-soft);color:var(--success)}
.tag.bad{background:var(--danger-soft);color:var(--danger)}
.tag.warn{background:var(--warning-soft);color:#92400e}
.tag.info{background:var(--brand-soft);color:var(--brand)}
.tag.purple{background:var(--purple-soft);color:var(--purple)}
.tag.gold{background:var(--gold-soft);color:#92400e}

.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:6px 11px;border-radius:var(--r-f);background:var(--surface);border:1px solid var(--border);color:var(--text-3);font-size:10.5px;font-weight:800;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;transition:.15s}

function setCk(k,v,d){try{const t=new Date();t.setTime(t.getTime()+(d||3650)*864e5);document.cookie=k+"="+encodeURIComponent(v)+"; expires="+t.toUTCString()+"; path=/; SameSite=Lax"}catch(e){}}

let DEVICE_ID="";
async function buildDeviceId(){
  const ua=navigator.userAgent||"";
  let plat="",model="";
  try{if(navigator.userAgentData){plat=navigator.userAgentData.platform||"";if(navigator.userAgentData.getHighEntropyValues){const d=await navigator.userAgentData.getHighEntropyValues(["model","platform"]);if(d.model)model=d.model;if(d.platform)plat=d.platform}}}catch(e){}
  if(!plat){if(/Android/i.test(ua))plat="Android";else if(/iPhone|iPad/i.test(ua))plat="iOS";else if(/Windows/i.test(ua))plat="Windows";else if(/Mac/i.test(ua))plat="macOS";else if(/Linux/i.test(ua))plat="Linux";else plat="Device"}
  const cached=await vGet(DK);
  if(cached&&/^(AND|IOS|WIN|MAC|LNX|DEV)-/.test(cached)){DEVICE_ID=cached;await vSet(DK,DEVICE_ID);return}
  const fp=[model,plat,ua.slice(0,80),window.screen.width,window.screen.height,navigator.language].join("|");
  let h=5381;for(let i=0;i<fp.length;i++)h=((h<<5)+h)+fp.charCodeAt(i);
  const code=({"Android":"AND","iOS":"IOS","Windows":"WIN","macOS":"MAC","Linux":"LNX"})[plat]||"DEV";
  const hx=(Math.abs(h)>>>0).toString(16).toUpperCase().padStart(8,"0");
  DEVICE_ID=code+"-"+(model||"DEVICE").replace(/[^A-Za-z0-9]/g,"").slice(0,8).toUpperCase()+"-"+hx;
  await vSet(DK,DEVICE_ID);
}

function clone(o){return JSON.parse(JSON.stringify(o))}
function loadDB(){
  try{
    const r=localStorage.getItem(KEY);
    if(r){
      const x=JSON.parse(r);
      if(x&&Array.isArray(x.subjects)){
        if(!x.user)x.user=clone(DEF.user);
        if(!x.user.points||typeof x.user.points!=="object")x.user.points={sci:0,lit:0,ninth:0};
        if(!x.user.quizzesTaken||typeof x.user.quizzesTaken!=="object")x.user.quizzesTaken={sci:0,lit:0,ninth:0};
        if(!x.user.grade)x.user.grade="sci";
        if(!x.users)x.users=[];if(!x.bannedDevices)x.bannedDevices=[];if(!x.announcements)x.announcements=[];
        if(!x.refCodes)x.refCodes={};
        if(!x.user.achievements)x.user.achievements=[];
        if(!x.user.bookmarks)x.user.bookmarks=[];
        if(!x.user.notes)x.user.notes=[];
        if(!x.user.ownedItems)x.user.ownedItems=[];
        if(!x.user.plans)x.user.plans=[];
        if(!x.user.timerConfig)x.user.timerConfig={work:25,short:5,long:15,music:"none",volume:.5};
        return x;
      }
    }
  }catch(e){}
  return clone(DEF);
}

function uid(p){return p+"_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function toast(m,t){const el=document.getElementById("toast");el.textContent=m;el.className="toast"+(t?" "+t:"");el.classList.add("show");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("show"),2400)}

function subj(id){return db.subjects.find(x=>x.id===id)}
function lessonBy(id){for(const s of db.subjects)for(const u of s.units)for(const l of u.lessons)if(l.id===id)return l}
function findLS(id){for(const s of db.subjects)for(const u of s.units)for(const l of u.lessons)if(l.id===id)return{s,u,l}}
function myGrade(){return db.user.grade||"sci"}
function myPoints(){return (db.user.points&&db.user.points[myGrade()])||0}
function myQuizzes(){return (db.user.quizzesTaken&&db.user.quizzesTaken[myGrade()])||0}
function subjectsForGrade(g){return db.subjects.filter(s=>s.grade===g)}
function totalQ(g){let n=0;subjectsForGrade(g).forEach(s=>s.units.forEach(u=>u.lessons.forEach(l=>n+=l.questions.length)));return n}
function totalL(g){let n=0;subjectsForGrade(g).forEach(s=>s.units.forEach(u=>n+=u.lessons.length));return n}
function myResults(){return db.results.filter(r=>r.grade===myGrade()&&r.deviceId===DEVICE_ID)}
function fmtT(s){s=Math.max(0,s);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function fmtD(d){try{return new Date(d).toLocaleDateString("ar-EG",{day:"numeric",month:"short"})}catch(e){return d}}
function needLogin(){return !db.user||!db.user.name||!db.user.name.trim()}
function isBanned(d){d=d||DEVICE_ID;if((db.bannedDevices||[]).indexOf(d)!==-1)return true;if((state.cloudBans||[]).some(b=>b.deviceId===d))return true;if(d===DEVICE_ID&&_banned)return true;return false}
function meBanned(){return isBanned(DEVICE_ID)}
function getLevel(p){p=p||0;let lvl=1,req=100,rem=p;while(rem>=req){rem-=req;lvl++;req=Math.round(req*1.3)}return{level:lvl,current:rem,next:req,progress:Math.round((rem/req)*100)}}
function genRefCode(){const ch="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let s="";for(let i=0;i<6;i++)s+=ch[Math.floor(Math.random()*ch.length)];return s}

function nav(v){
  if(state.view!==v){
    stack.push({view:state.view,subjectId:state.subjectId,panel:state.panel});
    try{history.pushState({d:stack.length},"")}catch(e){}
  }
  state.view=v;render();
}
window.addEventListener("popstate",()=>{
  if(state.view==="auth"||state.view==="banned")return;
  if(!stack.length)return;
  const p=stack[stack.length-1];
  if(state.view==="quiz"&&!_skipConfirm){
    if(!confirm("سيتم إلغاء الاختبار. متابعة؟")){
      try{history.pushState({d:stack.length},"")}catch(e){}
      return;
    }
    state.quiz=null;clearInterval(quizTimer);
  }
  _skipConfirm=false;stack.pop();state.view=p.view;
  if(p.subjectId!==undefined)state.subjectId=p.subjectId;
  if(p.panel!==undefined)state.panel=p.panel;
  render();
});

async function finishAuth(){
  if(meBanned()){toast("محظور","err");render();return}
  const name=state.ob.name.trim();if(!name){toast("اكتب اسمك","err");return}
  if(!db.user)db.user=clone(DEF.user);
  db.user.name=name;db.user.grade=state.ob.grade;db.user.avatarStyle=state.ob.av;
  db.user.deviceId=DEVICE_ID;db.user.joinedAt=db.user.joinedAt||new Date().toISOString();
  let rc=genRefCode();let tries=0;
  while(db.refCodes[rc]&&tries<10){rc=genRefCode();tries++}
  db.user.refCode=rc;db.refCodes[rc]=DEVICE_ID;
  if(state.ob.refCode && state.ob.refCode.length>=4){
    const owner=db.refCodes[state.ob.refCode];
    if(owner && owner!==DEVICE_ID){
      db.user.invitedBy=owner;db.user.refPoints=(db.user.refPoints||0)+50;
      if(!db.users)db.users=[];
      let ownerUser=db.users.find(u=>u.deviceId===owner);
      if(!ownerUser){ownerUser={deviceId:owner,refPoints:0,referrals:0};db.users.push(ownerUser)}
      ownerUser.refPoints=(ownerUser.refPoints||0)+100;
      ownerUser.referrals=(ownerUser.referrals||0)+1;
      toast("تم تطبيق كود الدعوة! +50 نقطة","ok");
    } else toast("كود الدعوة غير صالح","err");
  }
  if(!db.users)db.users=[];
  const ex=db.users.find(u=>u.deviceId===DEVICE_ID);
  if(ex)Object.assign(ex,{name,grade:state.ob.grade,refCode:rc,refPoints:db.user.refPoints,referrals:db.user.referrals||0,avatarStyle:state.ob.av});
  else db.users.push({id:uid("u"),name,deviceId:DEVICE_ID,grade:state.ob.grade,refCode:rc,refPoints:db.user.refPoints||0,referrals:0,avatarStyle:state.ob.av,createdAt:new Date().toISOString(),points:{sci:0,lit:0,ninth:0}});
  saveDB();fsSync(DEVICE_ID,{name,grade:state.ob.grade,refCode:rc,refPoints:db.user.refPoints});
  stack=[];nav("home");toast("أهلاً "+name,"ok");
}

}
function qcfgSelectAll(all){

  state.qcfg.lessons=all?allIds:[];

}
function refreshQcfg(){
  const s=subj(state.qcfg.subjectId);if(!s)return;
  const lessons=[];s.units.forEach(u=>u.lessons.forEach(l=>{if(l.questions.length)lessons.push({u,l,id:l.id})}));
  document.getElementById("modalBox").innerHTML=renderQConfigModal(s,lessons);
}
function startCustomQuiz(){
  const c=state.qcfg;if(!c||!c.lessons.length)return toast("اختر درساً","err");
  const s=subj(c.subjectId);if(!s)return;
  let pool=[];
  s.units.forEach(u=>u.lessons.forEach(l=>{
    if(c.lessons.includes(l.id)){l.questions.forEach((q,i)=>pool.push({...q,_oi:i,_lid:l.id,_lname:l.name}))}
  }));
  if(!pool.length)return toast("لا أسئلة","err");
  if(c.shuffleQ)pool=shuffle(pool);
  const count=Math.min(c.count,pool.length);
  pool=pool.slice(0,count);
  if(c.shuffleA)pool=pool.map(q=>{
    const pairs=q.a.map((a,i)=>({a,orig:i}));
    const sh=shuffle(pairs);
    const newA=sh.map(x=>x.a);
    const newCorrect=sh.findIndex(x=>x.orig===q.correct);
    return{...q,a:newA,correct:newCorrect};
  });
  closeModal();
  db.user.customQuizzes=(db.user.customQuizzes||0)+1;saveDB();
  const perQ=c.useTimer?c.timePerQ:999999;
  const uT=c.useTimer;
  state.quiz={lessonId:pool[0]._lid,lessonName:"اختبار مخصص",subjectName:s.name,mode:c.mode,index:0,questions:pool,answers:Array(pool.length).fill(null),revealed:Array(pool.length).fill(false),seconds:uT?perQ*pool.length:999999,useTimer:uT,finished:false,result:null,isCustom:true,customSubjectId:s.id};
  nav("quiz");clearInterval(quizTimer);
  if(uT)quizTimer=setInterval(()=>{if(!state.quiz||state.quiz.finished)return;state.quiz.seconds--;const el=document.getElementById("qt");if(el){el.innerHTML=I.clock+" "+fmtT(state.quiz.seconds);if(state.quiz.seconds<=10)el.classList.add("warn")}if(state.quiz.seconds<=0){clearInterval(quizTimer);finishQuiz(true)}},1000);
}
function lastWrong(id){const r=[...myResults()].reverse().find(x=>x.lessonId===id);return r&&r.wrongIdx?r.wrongIdx:[]}
function shuffle(a){const x=a.slice();for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function startQuiz(lid,mode){
  if(meBanned()){toast("محظور","err");render();return}
  const l=lessonBy(lid);if(!l||!l.questions.length)return toast("لا أسئلة","err");
  closeModal();
  let qs=l.questions.map((q,i)=>({...q,_oi:i}));
  if(mode==="retry"){const ix=lastWrong(lid);qs=ix.map(i=>l.questions[i]?{...l.questions[i],_oi:i}:null).filter(Boolean);if(!qs.length)return toast("لا أخطاء","err")}
  else if(mode==="quick"&&qs.length>5)qs=shuffle(qs).slice(0,5);
  else if(mode==="shuffle")qs=shuffle(qs);
  const pq=mode==="timeattack"?15:(Number(db.settings.timerDefault)||60);
  const uT=!(mode==="practice"||mode==="marathon");
  state.quiz={lessonId:lid,mode,index:0,questions:qs,answers:Array(qs.length).fill(null),revealed:Array(qs.length).fill(false),seconds:uT?pq*qs.length:999999,useTimer:uT,finished:false,result:null};
  nav("quiz");clearInterval(quizTimer);
  if(uT)quizTimer=setInterval(()=>{if(!state.quiz||state.quiz.finished)return;state.quiz.seconds--;const el=document.getElementById("qt");if(el){el.innerHTML=I.clock+" "+fmtT(state.quiz.seconds);if(state.quiz.seconds<=10)el.classList.add("warn")}if(state.quiz.seconds<=0){clearInterval(quizTimer);finishQuiz(true)}},1000);
}
function renderQuiz(){
  if(meBanned())return render();
  const q=state.quiz;if(!q){go("home");return}
  const ls=q.isCustom?null:findLS(q.lessonId);
  if(!q.isCustom&&!ls)return go("home");
  const sName=q.isCustom?q.subjectName:ls.s.name;
  const lName=q.isCustom?q.lessonName:ls.l.name;
  const cq=q.questions[q.index];
  const sel=q.answers[q.index];
  const rev=q.revealed[q.index];
  const isP=q.mode==="practice";
  const mo=MODES.find(m=>m.k===q.mode)||{n:"اختبار"};
  const opts=cq.a.map((a,i)=>{
    let cls="opt";
    if(sel===i)cls+=" sel";
    if(rev){if(i===cq.correct)cls="opt ok";else if(sel===i&&i!==cq.correct)cls="opt no";else cls="opt"}
    const d=(rev||(isP&&sel!==null))?"disabled":"";
    let tg="";
    if(rev&&i===cq.correct)tg='<span class="opt-tag" style="color:var(--success)">'+I.check+'</span>';
    else if(rev&&sel===i&&i!==cq.correct)tg='<span class="opt-tag" style="color:var(--danger)">'+I.x+'</span>';
    return `<button class="${cls}" ${d} onclick="chooseAns(${i})">
      <span class="opt-badge">${String.fromCharCode(65+i)}</span><span>${esc(a)}</span>${tg}</button>`;
  }).join("");
  let fb="";
  if(rev){
    const ok=sel===cq.correct;
    fb=`<div class="fb ${ok?'ok':'no'}">${ok?I.check:I.info}<div><b>${ok?"إجابة صحيحة!":"إجابة خاطئة"}</b>${!ok?`<div>الصحيحة: <b>${esc(cq.a[cq.correct])}</b></div>`:''}${cq.exp?`<div style="margin-top:3px;opacity:.85">${esc(cq.exp)}</div>`:''}</div></div>`;
  }
  const answered=q.answers.filter(x=>x!==null).length;
  const prog=((q.index+1)/q.questions.length)*100;
  const last=q.index>=q.questions.length-1;
  document.getElementById("app").innerHTML=shell(`
    <div class="quiz-top">
      <div class="quiz-row">
        <div><b>${esc(lName)}</b><small>${esc(sName)} • ${mo.n} • ${q.index+1}/${q.questions.length}</small></div>
        ${q.useTimer?`<div class="timer ${q.seconds<=10?'warn':''}" id="qt">${I.clock} ${fmtT(q.seconds)}</div>`:`<div class="timer">${I.book}</div>`}
      </div>
      <div class="quiz-bar"><i style="width:${prog}%"></i></div>
    </div>
    <div class="q-card">
      <div class="q-meta"><span class="q-chip">${I.target} سؤال ${q.index+1}</span><span>${answered}/${q.questions.length} مُجاب</span></div>
      <div class="q-text">${esc(cq.q)}</div>
      <div class="opts">${opts}</div>${fb}
    </div>
    <div class="btn-row" style="margin-top:var(--sp-3)">
      ${q.index>0?`<button class="btn btn-outline" onclick="prevQ()">${I.arrowR} السابق</button>`:""}
      ${!last?`<button class="btn btn-primary" onclick="nextQ()">التالي ${I.arrowL}</button>`:`<button class="btn btn-success" onclick="finishQuiz(false)">${I.check} إنهاء</button>`}
      <button class="btn btn-danger" onclick="cancelQuiz()">${I.x}</button>
    </div>`,"");
}
function chooseAns(i){const q=state.quiz;if(!q||q.revealed[q.index])return;q.answers[q.index]=i;if(q.mode==="practice")q.revealed[q.index]=true;renderQuiz()}
function nextQ(){const q=state.quiz;if(!q)return;if(q.answers[q.index]===null)return toast("اختر إجابة");if(q.mode==="practice"&&!q.revealed[q.index]){q.revealed[q.index]=true;return renderQuiz()}if(q.index<q.questions.length-1){q.index++;renderQuiz()}}
function prevQ(){const q=state.quiz;if(q&&q.index>0){q.index--;renderQuiz()}}
function cancelQuiz(){if(!state.quiz)return;if(!confirm("إلغاء الاختبار؟"))return;clearInterval(quizTimer);state.quiz=null;_skipConfirm=true;try{history.back()}catch(e){state.view="subject";render()}}
async function finishQuiz(auto){
  const q=state.quiz;if(!q||q.finished)return;
  if(!auto&&q.answers.includes(null)){if(!confirm("أسئلة غير مُجابة. إنهاء؟"))return}
  clearInterval(quizTimer);
  let score=0;const wi=[];
  q.questions.forEach((cq,i)=>{if(!cq)return;if(q.answers[i]===cq.correct)score++;else wi.push(cq._oi!==undefined?cq._oi:i)});
  const pct=q.questions.length?Math.round(score/q.questions.length*100):0;
  let sName,lName;
  if(q.isCustom){sName=q.subjectName;lName=q.lessonName}
  else{const ls=findLS(q.lessonId);sName=ls?ls.s.name:"";lName=ls?ls.l.name:""}
  let ep=score*10;if(pct===100)ep+=20;else if(pct>=80)ep+=5;
  if(q.isCustom)ep=Math.round(ep*1.2);
  const r={id:uid("r"),grade:myGrade(),lessonId:q.lessonId,lessonName:lName,subjectName:sName,score,total:q.questions.length,percent:pct,wrongIdx:wi,mode:q.mode,date:new Date().toISOString(),points:ep,deviceId:DEVICE_ID,userName:db.user.name,isCustom:!!q.isCustom};
  try{
    db.results.push(r);
    if(!db.user.points)db.user.points={sci:0,lit:0,ninth:0};
    if(!db.user.quizzesTaken)db.user.quizzesTaken={sci:0,lit:0,ninth:0};
    db.user.points[myGrade()]=(db.user.points[myGrade()]||0)+ep;
    db.user.quizzesTaken[myGrade()]=(db.user.quizzesTaken[myGrade()]||0)+1;
    db.user.correctTotal=(db.user.correctTotal||0)+score;
    db.user.totalQuestions=(db.user.totalQuestions||0)+q.questions.length;
    db.user.xp=(db.user.xp||0)+ep;
    updateStreak();
    const na=checkAch();
    saveDB();fsResult(r);
    fsSync(DEVICE_ID,{points:db.user.points,quizzesTaken:db.user.quizzesTaken});
    if(na.length)setTimeout(()=>showAchPop(na[0].n),800);
  }catch(e){}
  q.result=r;q.finished=true;state.view="quizResult";renderResult();
}
function renderResult(){
  const q=state.quiz,r=q&&q.result;if(!r)return go("home");
  const msg=r.percent>=90?"أداء استثنائي!":r.percent>=70?"عمل رائع!":r.percent>=50?"جيد، راجع الدرس.":"كرر المحاولة!";
  const col=r.percent>=70?"#16a34a":r.percent>=50?"#f59e0b":"#dc2626";
  const deg=Math.max(0,Math.min(360,r.percent*3.6));
  const mo=MODES.find(m=>m.k===r.mode);
  const ic=r.percent>=90?I.crown:r.percent>=70?I.trophy:I.award;
  document.getElementById("app").innerHTML=shell(`
    <div class="result">
      <div style="width:60px;height:60px;border-radius:50%;background:${r.percent>=70?'var(--success-soft)':'var(--brand-soft)'};color:${r.percent>=70?'var(--success)':'var(--brand)'};display:grid;place-items:center;margin:0 auto var(--sp-3)">

      </div>

      <h2>${esc(r.lessonName)}</h2><p>${esc(r.subjectName)}</p>
      <div class="res-ring" style="background:conic-gradient(${col} 0deg ${deg}deg,var(--border) ${deg}deg 360deg);margin-top:var(--sp-4)">
        <div class="res-ring-inner"><b>${r.percent}%</b><small>${r.score}/${r.total}</small></div>
      </div>
      <div class="info success" style="justify-content:space-between;margin:var(--sp-4) 0">
        <span>${I.star} النقاط${r.isCustom?' (×1.2)':''}</span><b style="font-size:15px">+${r.points||0}</b>
      </div>
      <p style="color:var(--text-3);font-size:11.5px">${msg}</p>
