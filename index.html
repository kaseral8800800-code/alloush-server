<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0097A7">
<title>منصة علوش التعليمية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<!-- ★ Firebase SDK ★ -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#f4f7f9;--surface:#fff;--surface-2:#f8fafb;--text:#0f2430;--text-2:#3a4a55;--muted:#7a8a95;--primary:#0097A7;--primary-d:#00788a;--primary-l:#e0f4f7;--accent:#00BCD4;--green:#16a34a;--green-l:#e7f8ec;--red:#e53935;--red-l:#fdecea;--gold:#f59e0b;--gold-l:#fff5e0;--line:#e6edf1;--line-2:#d6e0e6;--shadow-sm:0 1px 3px rgba(15,36,48,.06);--shadow:0 6px 20px rgba(15,36,48,.08);--shadow-lg:0 18px 45px rgba(15,36,48,.12);--radius:18px;--radius-lg:22px;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Cairo',Tahoma,Arial,sans-serif;font-weight:600;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
input,textarea,select{font-family:inherit;-webkit-user-select:text;user-select:text;font-size:15px}
body{overflow-x:hidden;min-height:100vh}
button{cursor:pointer;border:0;font-family:inherit;font-weight:700;color:inherit}
.hidden{display:none!important}svg{display:block}
.app{min-height:100vh;display:flex;flex-direction:column;background:radial-gradient(circle at 90% 0%,rgba(0,151,167,.08),transparent 35%),radial-gradient(circle at 0% 20%,rgba(0,188,212,.05),transparent 30%),var(--bg);padding-bottom:calc(78px + var(--safe-bottom))}
.topbar{position:sticky;top:0;z-index:40;padding:calc(8px + var(--safe-top)) 14px 8px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(255,255,255,.9);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;box-shadow:0 6px 16px rgba(0,151,167,.35)}
.logo svg{width:20px;height:20px}
.brand-text{min-width:0}
.brand-text b{display:block;font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-text small{display:block;color:var(--muted);font-size:10px;font-weight:600;margin-top:1px}
.top-actions{display:flex;gap:6px;align-items:center}
.icon-btn{width:36px;height:36px;border-radius:11px;background:var(--surface);color:var(--text-2);border:1px solid var(--line);display:grid;place-items:center;box-shadow:var(--shadow-sm)}
.icon-btn:active{transform:scale(.94);background:var(--primary-l);color:var(--primary-d);border-color:var(--primary)}
.icon-btn svg{width:17px;height:17px}
.avatar-btn{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--accent));display:grid;place-items:center;font-size:19px;color:#fff;border:2px solid #fff;box-shadow:var(--shadow-sm);overflow:hidden;padding:0}
.avatar-btn img{width:100%;height:100%;object-fit:cover}
.container{max-width:1100px;width:100%;margin:0 auto;padding:14px 14px 18px}
.primary{background:linear-gradient(135deg,var(--primary),var(--primary-d));color:#fff;padding:9px 14px;border-radius:11px;font-weight:800;font-size:12.5px;box-shadow:0 4px 12px rgba(0,151,167,.28);display:inline-flex;align-items:center;gap:5px;justify-content:center;white-space:nowrap}
.primary:active{transform:scale(.97)}
.primary svg{width:15px;height:15px}
.secondary{background:var(--surface);color:var(--text-2);border:1px solid var(--line-2);padding:9px 14px;border-radius:11px;font-weight:800;font-size:12.5px;display:inline-flex;align-items:center;gap:5px;justify-content:center;white-space:nowrap}
.secondary svg{width:14px;height:14px}
.danger{background:var(--red-l);color:var(--red);border:1px solid rgba(229,57,53,.2);padding:8px 12px;border-radius:10px;font-weight:800;font-size:12px;display:inline-flex;align-items:center;gap:5px}
.danger svg{width:13px;height:13px}
.success{background:var(--green-l);color:var(--green);border:1px solid rgba(22,163,74,.2);padding:8px 12px;border-radius:10px;font-weight:800;font-size:12px;display:inline-flex;align-items:center;gap:5px}
.success svg{width:13px;height:13px}
.warn{background:var(--gold-l);color:#b45309;border:1px solid rgba(245,158,11,.25);padding:8px 12px;border-radius:10px;font-weight:800;font-size:12px;display:inline-flex;align-items:center;gap:5px}
.warn svg{width:13px;height:13px}
.btn-row{display:flex;gap:7px;flex-wrap:wrap}
.hero{display:grid;grid-template-columns:1.4fr .9fr;gap:14px;margin-bottom:18px}
.hero-main{padding:22px;border-radius:var(--radius-lg);position:relative;overflow:hidden;background:linear-gradient(135deg,#fff,#f0fafb);border:1px solid var(--line);box-shadow:var(--shadow)}
.hero-main::after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(0,151,167,.15),transparent 70%);left:-100px;bottom:-140px}
.eyebrow{display:inline-flex;align-items:center;gap:5px;background:var(--primary-l);color:var(--primary-d);padding:5px 10px;border-radius:100px;font-size:11px;font-weight:800}
.hero h1{font-size:clamp(20px,4vw,30px);margin:12px 0 8px;line-height:1.35;font-weight:900}
.hero h1 .hl{color:var(--primary)}
.hero p{color:var(--muted);line-height:1.85;font-size:13px;margin-bottom:16px;font-weight:500}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.stat{padding:13px;border-radius:15px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
.stat b{font-size:22px;display:block;font-weight:900}
.stat span{font-size:11px;color:var(--muted);font-weight:700}
.stat.teal b{color:var(--primary)}.stat.green b{color:var(--green)}.stat.gold b{color:var(--gold)}.stat.red b{color:var(--red)}
.hero-side{padding:16px;border-radius:var(--radius-lg);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.notice{padding:11px 13px;border-radius:12px;background:var(--primary-l);border:1px solid rgba(0,151,167,.15);color:var(--primary-d);font-size:11.5px;line-height:1.75;font-weight:600;display:flex;gap:7px;align-items:flex-start}
.notice svg{width:15px;height:15px;flex-shrink:0;margin-top:2px}
.notice.warn-note{background:var(--gold-l);border-color:rgba(245,158,11,.25);color:#92400e}
.notice.ok-note{background:var(--green-l);border-color:rgba(22,163,74,.2);color:#166534}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 11px}
.section-title h2{font-size:16px;margin:0;font-weight:900;display:flex;align-items:center;gap:6px}
.section-title h2 svg{width:18px;height:18px;color:var(--primary)}
.section-title span{color:var(--muted);font-size:11px;font-weight:700}
.search{position:relative;margin-bottom:12px}
.search svg{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted);pointer-events:none}
.search input,.field input,.field textarea,.field select{width:100%;background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:11px 12px;outline:none;font-size:13.5px;font-weight:600}
.search input{padding-right:38px}
.search input:focus,.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(0,151,167,.12)}
.field textarea{resize:vertical;min-height:72px;line-height:1.7;font-size:12.5px}
.field textarea.code{direction:ltr;text-align:left;font-family:Consolas,Menlo,monospace;font-size:12px;line-height:1.55}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
.field label{font-size:11.5px;color:var(--text-2);font-weight:800}
.subject-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.subject{padding:16px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line);position:relative;overflow:hidden;box-shadow:var(--shadow-sm);cursor:pointer}
.subject:active{transform:scale(.98)}
.subject::before{content:"";position:absolute;top:0;right:0;left:0;height:3px;background:linear-gradient(90deg,var(--primary),var(--accent));opacity:0;transition:.2s}
.subject:hover::before{opacity:1}
.subject .emoji{font-size:28px;width:50px;height:50px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--primary-l),#f0fafb);margin-bottom:10px}
.subject h3{margin:0 0 5px;font-size:14px;font-weight:800}
.subject p{color:var(--muted);font-size:11.5px;margin:0 0 11px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.progress{height:5px;border-radius:99px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:99px}
.subject-meta{display:flex;justify-content:space-between;color:var(--muted);font-size:10.5px;margin-top:7px;font-weight:700}
.subject-meta span:last-child{color:var(--primary);font-weight:800}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--text-2);margin-bottom:12px;background:var(--surface);padding:8px 12px;border-radius:10px;border:1px solid var(--line);font-size:12px;font-weight:800;box-shadow:var(--shadow-sm)}
.back svg{width:14px;height:14px}
.breadcrumb{color:var(--muted);font-size:11px;margin-bottom:5px;font-weight:700}
.unit{margin-bottom:10px}
.unit-head{display:flex;align-items:center;justify-content:space-between;padding:13px 15px;background:var(--surface);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow-sm)}
.unit-title{display:flex;gap:10px;align-items:center}
.unit-num{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;display:grid;place-items:center;font-weight:900;font-size:14px;flex-shrink:0}
.unit-title b{font-size:13.5px}
.unit-title small{color:var(--muted);font-size:10.5px;font-weight:700;display:block;margin-top:1px}
.lesson-list{padding:7px 0 0;display:flex;flex-direction:column;gap:6px}
.lesson{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 13px;background:var(--surface);border:1px solid var(--line);border-radius:13px}
.lesson-info{display:flex;gap:9px;align-items:center;min-width:0;flex:1}
.lesson-icon{width:34px;height:34px;border-radius:10px;background:var(--primary-l);color:var(--primary-d);display:grid;place-items:center;flex-shrink:0}
.lesson-icon svg{width:15px;height:15px}
.lesson-info b{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lesson-info small{color:var(--muted);font-size:10.5px;display:block;margin-top:1px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quiz-head{padding:16px;border-radius:var(--radius-lg);background:linear-gradient(135deg,var(--primary),var(--primary-d));color:#fff;margin-bottom:12px;box-shadow:0 10px 24px rgba(0,151,167,.3);position:relative;overflow:hidden}
.quiz-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px;position:relative}
.quiz-bar b{font-size:14px;display:block}
.quiz-bar small{opacity:.85;font-size:10.5px;font-weight:600}
.timer{padding:7px 11px;border-radius:10px;background:rgba(255,255,255,.2);color:#fff;font-weight:900;font-size:13px;display:flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums}
.timer svg{width:13px;height:13px}
.quiz-head .progress{background:rgba(255,255,255,.25);height:6px}
.quiz-head .progress i{background:#fff}
.question-card{padding:18px;border-radius:var(--radius-lg);background:var(--surface);border:1px solid var(--line);margin-bottom:12px;box-shadow:var(--shadow)}
.qtop{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:11px;font-weight:800}
.qtop .chip{padding:4px 9px;border-radius:100px;background:var(--primary-l);color:var(--primary-d);font-size:10.5px}
.question{font-size:16px;line-height:1.8;font-weight:800;margin-bottom:15px}
.options{display:flex;flex-direction:column;gap:8px}
.option{display:flex;align-items:center;gap:10px;text-align:right;width:100%;padding:12px 13px;border-radius:13px;background:var(--surface-2);border:1.5px solid var(--line);color:var(--text);font-size:13px;font-weight:700;line-height:1.6}
.option:hover{border-color:var(--primary);background:var(--primary-l)}
.option.selected{border-color:var(--primary);background:var(--primary-l);color:var(--primary-d);box-shadow:0 0 0 3px rgba(0,151,167,.1)}
.option.correct{border-color:var(--green);background:var(--green-l);color:#166534}
.option.wrong{border-color:var(--red);background:var(--red-l);color:#991b1b}
.option:disabled{cursor:default}
.option .badge{min-width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:#fff;color:var(--text-2);font-weight:900;font-size:12px;border:1px solid var(--line);flex-shrink:0}
.option.selected .badge{background:var(--primary);color:#fff;border-color:var(--primary)}
.option.correct .badge{background:var(--green);color:#fff;border-color:var(--green)}
.option.wrong .badge{background:var(--red);color:#fff;border-color:var(--red)}
.option .check{margin-right:auto;width:18px;height:18px;color:var(--green)}
.option .x{margin-right:auto;width:18px;height:18px;color:var(--red)}
.feedback{margin-top:12px;padding:11px 14px;border-radius:12px;font-size:12.5px;font-weight:700;display:flex;gap:7px;align-items:flex-start;line-height:1.7}
.feedback.ok{background:var(--green-l);color:#166534;border:1px solid rgba(22,163,74,.2)}
.feedback.no{background:var(--red-l);color:#991b1b;border:1px solid rgba(229,57,53,.2)}
.feedback svg{width:16px;height:16px;flex-shrink:0;margin-top:2px}
.result{padding:24px 18px;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow)}
.score-circle{width:140px;height:140px;border-radius:50%;display:grid;place-items:center;margin:0 auto 16px;position:relative}
.score-circle::after{content:"";position:absolute;inset:10px;background:var(--surface);border-radius:50%}
.score-circle b{position:relative;z-index:1;font-size:30px;font-weight:900}
.score-circle small{position:relative;z-index:1;display:block;font-size:10px;color:var(--muted);font-weight:700}
.result h2{font-size:18px;font-weight:900;margin:8px 0 5px}
.result p{color:var(--muted);font-size:12.5px;line-height:1.8;font-weight:600}
.card{padding:6px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-sm)}
.result-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 12px;border-radius:12px}
.result-row+.result-row{border-top:1px solid var(--line)}
.result-row .pct{font-weight:900;font-size:13px;padding:5px 10px;border-radius:100px;background:var(--primary-l);color:var(--primary-d)}
.result-row .pct.good{background:var(--green-l);color:#166534}
.result-row .pct.bad{background:var(--red-l);color:#991b1b}
.empty{text-align:center;padding:38px 18px;color:var(--muted);background:var(--surface);border:1px dashed var(--line-2);border-radius:18px;font-weight:700;font-size:13px;line-height:1.9}
.empty svg{width:48px;height:48px;color:var(--line-2);margin:0 auto 12px}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:9px;align-items:end;margin-bottom:16px}
.podium-item{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 8px;text-align:center;box-shadow:var(--shadow-sm);position:relative}
.podium-item.first{background:linear-gradient(160deg,#fff9e6,#fff5e0);border-color:rgba(245,158,11,.3);padding-top:20px;padding-bottom:20px}
.podium-item.second{background:linear-gradient(160deg,#f0f4f8,#e9eef4)}
.podium-item.third{background:linear-gradient(160deg,#fdf1ea,#fbe7d8)}
.podium-crown{position:absolute;top:-12px;left:50%;transform:translateX(-50%);font-size:22px}
.podium-avatar{width:54px;height:54px;border-radius:50%;margin:0 auto 7px;display:grid;place-items:center;font-size:26px;background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;border:3px solid #fff;overflow:hidden}
.podium-item.first .podium-avatar{width:64px;height:64px;font-size:30px}
.podium-avatar img{width:100%;height:100%;object-fit:cover}
.podium-item b{display:block;font-size:12px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.podium-item .pts{display:inline-flex;align-items:center;gap:3px;margin-top:5px;background:var(--primary-l);color:var(--primary-d);padding:3px 9px;border-radius:100px;font-size:10.5px;font-weight:900}
.podium-item.first .pts{background:var(--gold-l);color:#b45309}
.rank-num{position:absolute;top:7px;right:8px;width:20px;height:20px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:10px;font-weight:900}
.podium-item.first .rank-num{background:var(--gold)}
.podium-item.second .rank-num{background:#94a3b8}
.podium-item.third .rank-num{background:#c2692c}
.lb-list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow-sm)}
.lb-row{display:flex;align-items:center;gap:10px;padding:11px 13px;border-bottom:1px solid var(--line)}
.lb-row:last-child{border-bottom:0}
.lb-row.me{background:var(--primary-l)}
.lb-row .pos{width:28px;height:28px;border-radius:9px;background:var(--surface-2);color:var(--text-2);display:grid;place-items:center;font-weight:900;font-size:12px;flex-shrink:0}
.lb-row .pos.top{background:var(--gold);color:#fff}
.lb-avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:18px;background:linear-gradient(135deg,var(--primary-l),#d5f0f3);overflow:hidden;flex-shrink:0;border:2px solid #fff}
.lb-avatar img{width:100%;height:100%;object-fit:cover}
.lb-info{flex:1;min-width:0}
.lb-info b{display:block;font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-info small{display:block;font-size:10.5px;color:var(--muted);font-weight:700;margin-top:1px}
.lb-pts{font-weight:900;color:var(--primary);font-size:13.5px;display:flex;align-items:center;gap:3px}
.lb-pts svg{width:12px;height:12px;color:var(--gold)}
.profile-header{padding:20px;border-radius:var(--radius-lg);background:linear-gradient(135deg,var(--primary),var(--primary-d));color:#fff;margin-bottom:12px;position:relative;overflow:hidden}
.profile-header::before{content:"";position:absolute;top:-60px;right:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.15),transparent 70%)}
.profile-top{display:flex;align-items:center;gap:14px;position:relative}
.profile-avatar{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;font-size:34px;background:rgba(255,255,255,.2);border:3px solid rgba(255,255,255,.5);overflow:hidden;flex-shrink:0}
.profile-avatar img{width:100%;height:100%;object-fit:cover}
.profile-info{min-width:0;flex:1}
.profile-info h2{margin:0 0 4px;font-size:18px;font-weight:900;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profile-info .rank-line{display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;opacity:.9;flex-wrap:wrap}
.device-chip{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.18);padding:3px 8px;border-radius:100px;font-size:10px;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums}
.device-chip svg{width:11px;height:11px}
.profile-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.15);position:relative}
.profile-stat{text-align:center}
.profile-stat b{display:block;font-size:20px;font-weight:900;color:#fff}
.profile-stat span{font-size:10px;font-weight:700;opacity:.8}
.profile-section{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:10px;box-shadow:var(--shadow-sm)}
.profile-section h3{margin:0 0 10px;font-size:13.5px;font-weight:900;display:flex;align-items:center;gap:6px}

<script>
"use strict";

/* =========================================================
   Firebase Config — من لوحة Firebase
   ========================================================= */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCuc_TvsiXiTQfBqTXHzXCdAIzI9VQA3Co",
  authDomain: "alooshclose.firebaseapp.com",
  projectId: "alooshclose",
  storageBucket: "alooshclose.firebasestorage.app",
  messagingSenderId: "634133828611",
  appId: "1:634133828611:web:f683299083d0c799342a36"
};

/* ★ حالة الاتصال بـ Firebase ★ */
const cloud = {
  ok: false,
  checking: true,
  db: null,
  banUnsubscribe: null,
  lastError: ""
};

/* =========================================================
   Firebase helpers
   ========================================================= */
async function initFirebase(){
  try{
    if(typeof firebase === "undefined"){
      cloud.lastError = "SDK not loaded";
      cloud.ok = false;
      return false;
    }
    if(!firebase.apps || !firebase.apps.length){
      firebase.initializeApp(FIREBASE_CONFIG);
    }
    cloud.db = firebase.firestore();
    // Try to enable persistence so offline works
    try{
      await cloud.db.enablePersistence({synchronizeTabs:true});
    }catch(e){ /* Multi-tab or unsupported — ignore */ }
    // Quick health check
    await cloud.db.collection("_health").doc("ping").get();
    cloud.ok = true;
    cloud.checking = false;
    return true;
  }catch(e){
    cloud.lastError = String(e && e.message || e);
    cloud.ok = false;
    cloud.checking = false;
    console.warn("Firebase init failed:", e);
    return false;
  }
}

async function firestoreCheckBan(deviceId){
  if(!cloud.ok || !cloud.db) return null;
  try{
    const doc = await cloud.db.collection("bans").doc(deviceId).get();
    return doc.exists ? (doc.data()||{}) : null;
  }catch(e){
    console.warn("check ban failed:", e);
    return null;
  }
}

async function firestoreSetBan(deviceId, data){
  if(!cloud.ok || !cloud.db) return false;
  try{
    await cloud.db.collection("bans").doc(deviceId).set(Object.assign({
      deviceId: deviceId,
      bannedAt: firebase.firestore.FieldValue.serverTimestamp(),
      bannedAtMs: Date.now()
    }, data || {}));
    return true;
  }catch(e){
    console.warn("set ban failed:", e);
    return false;
  }
}

async function firestoreRemoveBan(deviceId){
  if(!cloud.ok || !cloud.db) return false;
  try{
    await cloud.db.collection("bans").doc(deviceId).delete();
    return true;
  }catch(e){
    console.warn("remove ban failed:", e);
    return false;
  }
}

function firestoreWatchBan(deviceId, callback){
  if(!cloud.ok || !cloud.db) return null;
  try{
    const unsub = cloud.db.collection("bans").doc(deviceId).onSnapshot(
      (doc)=>{
        if(doc.exists){
          callback(true, doc.data()||{});
        } else {
          callback(false, null);
        }
      },
      (err)=>{ console.warn("ban watch error:", err); }
    );
    return unsub;
  }catch(e){
    console.warn("watch failed:", e);
    return null;
  }
}

/* Fetch all bans (for admin view) */
async function firestoreFetchBans(){
  if(!cloud.ok || !cloud.db) return null;
  try{
    const snap = await cloud.db.collection("bans").get();
    const arr = [];
    snap.forEach(d=>arr.push(Object.assign({ deviceId:d.id }, d.data())));
    return arr;
  }catch(e){ return null; }
}

/* Users sync */
async function firestoreSyncUser(deviceId, data){
  if(!cloud.ok || !cloud.db) return false;
  try{
    await cloud.db.collection("users").doc(deviceId).set(Object.assign({
      deviceId: deviceId,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, data||{}), { merge: true });
    return true;
  }catch(e){ return false; }
}

async function firestoreFetchUsers(){
  if(!cloud.ok || !cloud.db) return null;
  try{
    const snap = await cloud.db.collection("users").get();
    const arr = [];
    snap.forEach(d=>arr.push(Object.assign({ deviceId:d.id }, d.data())));
    return arr;
  }catch(e){ return null; }
}

/* Results sync */
async function firestorePushResult(result){
  if(!cloud.ok || !cloud.db) return false;
  try{
    await cloud.db.collection("results").doc(result.id).set(Object.assign({
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    }, result));
    return true;
  }catch(e){ return false; }
}

async function firestoreFetchResults(){
  if(!cloud.ok || !cloud.db) return null;
  try{
    const snap = await cloud.db.collection("results").orderBy("createdAt","desc").limit(500).get();
    const arr = [];
    snap.forEach(d=>arr.push(d.data()));
    return arr;
  }catch(e){ return null; }
}

/* =========================================================
   Local multi-layer storage (unchanged)
   ========================================================= */
const KEY = "aloosh_edu_v9";
const DEVICE_KEY = "aloosh_device_id_v9";
const DEVICE_INFO_KEY = "aloosh_device_info_v9";
const BAN_KEY = "aloosh_ban_v9";

let _idb = null;
function openIDB(){
  return new Promise((res)=>{
    if(_idb) return res(_idb);
    try{
      const req = indexedDB.open("aloosh_vault", 1);
      req.onupgradeneeded = ()=>{ try{ req.result.createObjectStore("kv"); }catch(e){} };
      req.onsuccess = ()=>{ _idb=req.result; res(_idb); };
      req.onerror = ()=>res(null);
      setTimeout(()=>res(_idb), 1500);
    }catch(e){ res(null); }
  });
}
function idbSet(k,v){
  return new Promise((res)=>{
    openIDB().then(db=>{
      if(!db) return res(false);
      try{
        const tx=db.transaction("kv","readwrite");
        tx.objectStore("kv").put(v, k);
        tx.oncomplete=()=>res(true); tx.onerror=()=>res(false);
      }catch(e){ res(false); }
    });
  });
}
function idbGet(k){
  return new Promise((res)=>{
    openIDB().then(db=>{
      if(!db) return res(null);
      try{
        const tx=db.transaction("kv","readonly");
        const r=tx.objectStore("kv").get(k);
        r.onsuccess=()=>res(r.result==null?null:r.result);
        r.onerror=()=>res(null);
      }catch(e){ res(null); }
    });
  });
}
function setCookie(k, v, days){
  try{
    const d = new Date();
    d.setTime(d.getTime() + (days||3650)*24*60*60*1000);
    document.cookie = k + "=" + encodeURIComponent(v) + "; expires=" + d.toUTCString() + "; path=/; SameSite=Lax";
  }catch(e){}
}
function getCookie(k){
  try{
    const m = document.cookie.match(new RegExp("(?:^|; )" + k.replace(/([.*+?^${}()|[\]\\])/g,"\\$1") + "=([^;]*)"));
    return m ? decodeURIComponent(m[1]) : null;
  }catch(e){ return null; }
}
const WN_TAG = "__ALOOSH__";
function wnSet(k, v){
  try{
    let name = window.name || "";
    const old = name.indexOf(WN_TAG);
    if(old >= 0) name = name.substring(0, old);
    const seg = name.indexOf("###");
    let existing = {};
    if(seg >= 0){
      try{ existing = JSON.parse(name.substring(seg+3)); }catch(e){ existing = {}; }
      name = name.substring(0, seg);
    }
    existing[k] = v;
    window.name = name + "###" + JSON.stringify(existing) + WN_TAG;
  }catch(e){}
}
function wnGet(k){
  try{
    const name = window.name || "";
    const seg = name.indexOf("###");
    if(seg < 0) return null;
    const json = name.substring(seg+3).replace(WN_TAG, "");
    const obj = JSON.parse(json);
    return obj && obj[k] != null ? obj[k] : null;
  }catch(e){ return null; }
}
async function vaultSet(key, value){
  const v = String(value);
  try{ localStorage.setItem(key, v); }catch(e){}
  try{ sessionStorage.setItem(key, v); }catch(e){}
  setCookie(key, v, 3650);
  wnSet(key, v);
  await idbSet(key, v);
}
async function vaultGet(key){
  try{ const v=localStorage.getItem(key); if(v!=null) return v; }catch(e){}
  const c = getCookie(key); if(c != null) return c;
  const idb = await idbGet(key); if(idb != null) return String(idb);
  try{ const v=sessionStorage.getItem(key); if(v!=null) return v; }catch(e){}
  const w = wnGet(key); if(w != null) return String(w);
  return null;
}

/* ===== Device fingerprint ===== */
let DEVICE_ID = "";
let DEVICE_INFO = { model:"", platform:"", platformVersion:"", browser:"", screen:"", cores:0, memory:0, timezone:"", lang:"", colorDepth:0, touch:0, gpu:"" };

function detectPlatformFromUA(ua){
  if(/Android/i.test(ua)) return "Android";
  if(/iPhone|iPad|iPod/i.test(ua)) return "iOS";
  if(/Windows/i.test(ua)) return "Windows";
  if(/Macintosh|Mac OS/i.test(ua)) return "macOS";
  if(/Linux/i.test(ua)) return "Linux";
  return "Device";
}
function detectBrowserFromUA(ua){
  if(/Edg\//i.test(ua)) return "Edge";
  if(/OPR\/|Opera/i.test(ua)) return "Opera";
  if(/Chrome\//i.test(ua) && !/Edg\//i.test(ua)) return "Chrome";
  if(/Safari\//i.test(ua) && !/Chrome/i.test(ua)) return "Safari";
  if(/Firefox\//i.test(ua)) return "Firefox";
  return "Browser";
}
function extractModelFromUA(ua, platform){
  const m = ua.match(/\(([^)]+)\)/);
  if(!m) return "";
  const parts = m[1].split(";").map(x=>x.trim());
  const known = parts.find(p=>/^(SM-|GT-|Redmi|Mi |POCO|M[0-9]|HUAWEI|HONOR|OPPO|CPH|vivo|V[0-9]|Infinix|Tecno|Nokia|Pixel|LM-|ANE-|MAR-|iPhone|iPad|OnePlus|Realme|RMX)/i.test(p));
  if(known) return known.replace(/\s*Build\/.*/i,"").trim();
  const withBuild = parts.find(p=>/Build\//i.test(p));
  if(withBuild) return withBuild.split("Build/")[0].trim();
  if(platform==="iOS"){
    const ip = parts.find(p=>/iPhone|iPad|iPod/i.test(p));
    if(ip) return ip.split(/\sOS\s/i)[0].trim();
  }
  if(platform==="Windows") return "Windows PC";
  return "";
}
function getGPURenderer(){
  try{
    const c = document.createElement("canvas");
    const gl = c.getContext("webgl") || c.getContext("experimental-webgl");
    if(!gl) return "";
    const dbg = gl.getExtension("WEBGL_debug_renderer_info");
    if(!dbg) return "";
    return String(gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) || "").slice(0,60);
  }catch(e){ return ""; }
}
async function buildDeviceId(){
  let model="", platform="", platformVersion="", browser="";
  const ua = navigator.userAgent || "";
  try{
    if(navigator.userAgentData){
      platform = navigator.userAgentData.platform || "";
      if(navigator.userAgentData.getHighEntropyValues){
        const d = await navigator.userAgentData.getHighEntropyValues(["model","platform","platformVersion","fullVersionList"]);
        if(d.model) model = d.model;
        if(d.platform) platform = d.platform;
        if(d.platformVersion) platformVersion = d.platformVersion;
        if(Array.isArray(d.fullVersionList) && d.fullVersionList.length){
          const b = d.fullVersionList.find(x=>/Chrome|Edge|Opera|Samsung|Firefox/i.test(x.brand));
          if(b) browser = b.brand;
        }
      }
    }
  }catch(e){}
  if(!platform) platform = detectPlatformFromUA(ua);
  if(!browser) browser = detectBrowserFromUA(ua);
  if(!model) model = extractModelFromUA(ua, platform);
  const screenStr = (window.screen && window.screen.width ? window.screen.width : 0) + "x" + (window.screen && window.screen.height ? window.screen.height : 0);
  const ratio = window.devicePixelRatio || 1;
  const cores = navigator.hardwareConcurrency || 0;
  const memory = navigator.deviceMemory || 0;
  const colorDepth = (window.screen && window.screen.colorDepth) || 0;
  const touch = navigator.maxTouchPoints || 0;
  let tz = "";
  try{ tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; }catch(e){}
  const lang = navigator.language || "";
  const gpu = getGPURenderer();
  DEVICE_INFO = { model: model||"جهاز", platform:platform||"", platformVersion:platformVersion||"", browser:browser||"", screen:screenStr, ratio, cores, memory, timezone:tz, lang, colorDepth, touch, gpu };
  const cachedId = await vaultGet(DEVICE_KEY);
  if(cachedId && (cachedId.startsWith("AND-")||cachedId.startsWith("IOS-")||cachedId.startsWith("WIN-")||cachedId.startsWith("MAC-")||cachedId.startsWith("LNX-")||cachedId.startsWith("DEV-"))){
    DEVICE_ID = cachedId;
    const ci = await vaultGet(DEVICE_INFO_KEY);
    if(ci){ try{ const p=JSON.parse(ci); DEVICE_INFO = Object.assign(DEVICE_INFO, p); }catch(e){} }
    await vaultSet(DEVICE_KEY, DEVICE_ID);
    await vaultSet(DEVICE_INFO_KEY, JSON.stringify(DEVICE_INFO));
    return;
  }
  const fingerprintParts = [model, platform, platformVersion, screenStr, ratio, cores, memory, tz, lang, colorDepth, touch, gpu].join("|");
  let h1 = 0, h2 = 5381;
  for(let i=0;i<fingerprintParts.length;i++){
    const c = fingerprintParts.charCodeAt(i);
    h1 = ((h1<<5) - h1) + c; h1 = h1 | 0;
    h2 = ((h2<<5) + h2) + c; h2 = h2 | 0;
  }
  const hash1 = (Math.abs(h1)>>>0).toString(16).toUpperCase().padStart(8,"0");
  const hash2 = (Math.abs(h2)>>>0).toString(16).toUpperCase().padStart(8,"0");
  const combined = (hash1 + hash2).slice(0,10);
  const platCode = ({"Android":"AND","iOS":"IOS","Windows":"WIN","macOS":"MAC","Linux":"LNX"})[platform] || "DEV";
  const safeModel = (model||"DEVICE").replace(/[^A-Za-z0-9]/g,"").toUpperCase().slice(0,10) || "DEVICE";
  DEVICE_ID = platCode + "-" + safeModel + "-" + combined;
  await vaultSet(DEVICE_KEY, DEVICE_ID);
  await vaultSet(DEVICE_INFO_KEY, JSON.stringify(DEVICE_INFO));
}

async function checkLocalBan(){
  const banData = await vaultGet(BAN_KEY);
  if(!banData) return false;
  try{
    const obj = JSON.parse(banData);
    if(obj && obj[DEVICE_ID]){
      _banReason = (obj[DEVICE_ID] && obj[DEVICE_ID].reason) || "";
      return true;
    }
  }catch(e){}
  return false;
}
async function applyLocalBan(deviceId, reason){
  const banData = await vaultGet(BAN_KEY) || "{}";
  let obj = {};
  try{ obj = JSON.parse(banData); }catch(e){ obj = {}; }
  obj[deviceId] = { ts: Date.now(), reason: reason||"" };
  await vaultSet(BAN_KEY, JSON.stringify(obj));
}
async function removeLocalBan(deviceId){
  const banData = await vaultGet(BAN_KEY);
  if(!banData) return;
  let obj = {};
  try{ obj = JSON.parse(banData); }catch(e){ return; }
  delete obj[deviceId];
  await vaultSet(BAN_KEY, JSON.stringify(obj));
}

function subject(id){return db.subjects.find(x=>x.id===id)}
function lessonBy(id){for(const s of db.subjects)for(const u of s.units)for(const l of u.lessons)if(l.id===id)return l}
function findLessonSubject(id){for(const s of db.subjects)for(const u of s.units)for(const l of u.lessons)if(l.id===id)return{s,u,l};return null}
function totalQuestions(){let n=0;db.subjects.forEach(s=>s.units.forEach(u=>u.lessons.forEach(l=>n+=l.questions.length)));return n}
function totalLessons(){let n=0;db.subjects.forEach(s=>s.units.forEach(u=>n+=u.lessons.length));return n}
function totalUnits(){let n=0;db.subjects.forEach(s=>n+=s.units.length);return n}
function formatTime(s){s=Math.max(0,s);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function fmtDate(d){try{return new Date(d).toLocaleDateString("ar-EG",{day:"numeric",month:"short",year:"numeric"})}catch(e){return d}}
function renderAvatar(u){u=u||db.user||{};if(u.avatar && String(u.avatar).startsWith("data:")) return '<img src="'+u.avatar+'" alt="">';return '<span>'+esc(u.avatar||"🧑‍🎓")+'</span>'}
function needsLogin(){return !db.user || !db.user.name || !db.user.name.trim()}
function isBanned(deviceId){
  deviceId = deviceId || DEVICE_ID;
  if((db.bannedDevices||[]).indexOf(deviceId) !== -1) return true;
  if((state.cloudBans||[]).some(b=>b.deviceId===deviceId)) return true;
  if(deviceId === DEVICE_ID && _isBanned) return true;
  return false;
}
function isCurrentUserBanned(){return isBanned(DEVICE_ID)}
function cloudBadge(){
  if(cloud.checking) return '<span class="cloud-badge checking">'+I.cloud+' جاري الاتصال...</span>';
  if(cloud.ok) return '<span class="cloud-badge on">'+I.cloud+' متصل بالسحابة</span>';
  return '<span class="cloud-badge off">'+I.cloud+' غير متصل (محلي)</span>';
}

/* ===== Nav ===== */
function nav(view){
  if(state.view!==view){
    navStack.push({ view:state.view, subjectId:state.subjectId, adminPanel:state.adminPanel });
    try{ history.pushState({ depth:navStack.length }, ""); }catch(e){}
  }
  state.view=view;render();
}
window.addEventListener("popstate", function(){
  if(state.view==="login"||state.view==="banned") return;
  if(navStack.length===0) return;
  const prev=navStack[navStack.length-1];
  if(state.view==="quiz" && !_skipQuizConfirm){
    if(!confirm("سيتم إلغاء الاختبار. متأكد؟")){
      try{ history.pushState({ depth:navStack.length }, ""); }catch(e){}
      return;
    }
    state.quiz=null;clearInterval(quizTimer);
  }
  _skipQuizConfirm=false;
  navStack.pop();
  state.view=prev.view;
  if(prev.subjectId!==undefined) state.subjectId=prev.subjectId;
  if(prev.adminPanel!==undefined) state.adminPanel=prev.adminPanel;
  render();
});

function render(){
  const app=document.getElementById("app");
  if(isCurrentUserBanned()){ state.view="banned"; app.innerHTML=renderBannedScreen(); return; }
  if(needsLogin()){ state.view="login"; app.innerHTML=renderLoginScreen(); return; }
  if(state.view==="quiz") return renderQuiz();
  if(state.view==="quizResult") return renderQuizResult();
  if(state.view==="admin") return renderAdmin();
  if(state.view==="subjects") return app.innerHTML=shell(renderSubjects(),"subjects");
  if(state.view==="subject") return app.innerHTML=shell(renderSubject(),"subjects");
  if(state.view==="results") return app.innerHTML=shell(renderResults(),"results");
  if(state.view==="leaderboard") return app.innerHTML=shell(renderLeaderboard(),"leaderboard");
  if(state.view==="profile") return app.innerHTML=shell(renderProfile(),"profile");
  app.innerHTML=shell(renderHome(),"home");
}

async function doLogin(){
  if(isCurrentUserBanned()){toast("هذا الجهاز محظور");render();return}
  const name=document.getElementById("loginName").value.trim();
  if(!name){toast("اكتب اسمك أولاً");return}
  if(!db.user) db.user=cloneDB(defaultDB.user);
  db.user.name=name;
  db.user.deviceId=DEVICE_ID;
  db.user.joinedAt=db.user.joinedAt||new Date().toISOString();
  if(!db.users) db.users=[];
  const existing=db.users.find(u=>u.deviceId===DEVICE_ID);
  if(existing){
    existing.name=name;
    existing.lastSeen=new Date().toISOString();
    existing.deviceInfo=DEVICE_INFO;
  } else {
    db.users.push({
      id:uid("u"), name, deviceId:DEVICE_ID,
      deviceInfo:DEVICE_INFO,
      createdAt:new Date().toISOString(),
      lastSeen:new Date().toISOString(),
      points:db.user.points||0
    });
  }
  saveDB();
  // Sync to Firestore (async — don't block UI)
  firestoreSyncUser(DEVICE_ID, {
    name: name,
    deviceInfo: DEVICE_INFO,
    points: db.user.points||0,
    quizzesTaken: db.user.quizzesTaken||0,
    correctTotal: db.user.correctTotal||0,
    joinedAt: db.user.joinedAt
  });
  nav("home");toast("أهلاً "+name+" 🎉");
}

/* ===== Quiz ===== */
let quizTimer=null;
function openQuizSetup(lessonId){
  const l=lessonBy(lessonId);if(!l||!l.questions.length){toast("لا توجد أسئلة");return}
  const wrongFromLast=getWrongIdsFromLast(lessonId);
  showModal(`<div class="modal-head"><h2>اختر وضع الاختبار</h2><button class="icon-btn" onclick="closeModal()">${I.x}</button></div>
  <div class="notice" style="margin-bottom:12px">${I.info}<span>الدرس: <b>${esc(l.name)}</b> • ${l.questions.length} سؤال${wrongFromLast.length?` • ${wrongFromLast.length} خطأ سابق`:''}</span></div>
  <div class="mode-grid">
    <div class="mode-card" onclick="startQuiz('${lessonId}','practice')">
      <div class="mi" style="background:linear-gradient(135deg,var(--green),#22c55e)">${I.book}</div>
      <h4>وضع التدريب</h4><p>تصحيح فوري بعد كل سؤال.</p>
    </div>
    <div class="mode-card" onclick="startQuiz('${lessonId}','exam')">
      <div class="mi">${I.target}</div><h4>وضع الاختبار</h4><p>التصحيح في النهاية فقط.</p>
    </div>
  </div>
  ${wrongFromLast.length?`<button class="secondary" style="width:100%;margin-top:4px" onclick="startQuiz('${lessonId}','retry')">${I.refresh} إعادة الأخطاء (${wrongFromLast.length})</button>`:''}`);
}
function getWrongIdsFromLast(lessonId){
  const last=[...db.results].reverse().find(r=>r.lessonId===lessonId);
  if(!last||!last.wrongIdx||!last.wrongIdx.length)return[];
  return last.wrongIdx;
}
function startQuiz(lessonId, mode){
  if(isCurrentUserBanned()){toast("محظور");render();return}
  const l=lessonBy(lessonId);if(!l||!l.questions.length){toast("لا توجد أسئلة");return}
  closeModal();
  let questions = l.questions.map((q,i)=>({...q, _origIndex:i}));
  if(mode==="retry"){
    const idxs=getWrongIdsFromLast(lessonId);
    questions = idxs.map(i=>l.questions[i]?{...l.questions[i],_origIndex:i}:null).filter(Boolean);
    if(!questions.length){toast("لا توجد أخطاء");return}
  }
  state.quiz={ lessonId, mode, index:0, questions,
    answers:Array(questions.length).fill(null),
    revealed:Array(questions.length).fill(false),
    seconds: mode==="practice"? 999999 : (Number(db.settings.timerDefault)||60)*questions.length,
    start:Date.now(), finished:false, result:null };
  nav("quiz");
  clearInterval(quizTimer);
  if(mode!=="practice"){
    quizTimer=setInterval(()=>{
      if(!state.quiz || state.quiz.finished)return;
      state.quiz.seconds--;
      const el=document.getElementById("quizTimer");
      if(el)el.innerHTML=I.clock+' '+formatTime(state.quiz.seconds);
      if(state.quiz.seconds<=0){clearInterval(quizTimer);finishQuiz(true)}
    },1000);
  }
}
function renderQuiz(){
  if(isCurrentUserBanned()){render();return}
  const qs=state.quiz; if(!qs){goHome();return}
  const lsInfo=findLessonSubject(qs.lessonId); if(!lsInfo){goHome();return}
  const {s,l}=lsInfo;
  const q=qs.questions[qs.index];
  const selected=qs.answers[qs.index];
  const revealed=qs.revealed[qs.index];
  const isPractice=qs.mode==="practice";
  const modeName=qs.mode==="practice"?"تدريب":qs.mode==="retry"?"إعادة خطأ":"اختبار";
  const opts=q.a.map((a,i)=>{
    let cls="option";
    if(selected===i)cls+=" selected";
    if(revealed){
      if(i===q.correct)cls="option correct";
      else if(selected===i && i!==q.correct)cls="option wrong";
      else cls="option";
    }
    const disabled=(revealed||(isPractice&&selected!==null))?"disabled":"";
    let trailing="";
    if(revealed && i===q.correct) trailing='<span class="check">'+I.check+'</span>';
    else if(revealed && selected===i && i!==q.correct) trailing='<span class="x">'+I.x+'</span>';
    return `<button class="${cls}" ${disabled} onclick="chooseAnswer(${i})">
      <span class="badge">${String.fromCharCode(65+i)}</span><span>${esc(a)}</span>${trailing}</button>`;
  }).join("");
  let feedback="";
  if(revealed){
    const isRight=selected===q.correct;
    feedback=`<div class="feedback ${isRight?'ok':'no'}">${isRight?I.check:I.info}
      <div><b>${isRight?"إجابة صحيحة!":"إجابة خاطئة"}</b>
        ${!isRight?`<div>الصحيحة: <b>${esc(q.a[q.correct])}</b></div>`:''}
        ${q.exp?`<div style="margin-top:4px;font-weight:600;opacity:.9">💡 ${esc(q.exp)}</div>`:''}
      </div></div>`;
  }
  const answeredCount=qs.answers.filter(x=>x!==null).length;
  const progress=((qs.index+1)/qs.questions.length)*100;
  const isLast=qs.index>=qs.questions.length-1;
  document.getElementById("app").innerHTML=shell(`
    <div class="quiz-head">
      <div class="quiz-bar"><div>
        <b>${esc(l.name)}</b>
        <small>${esc(s.name)} • ${modeName} • السؤال ${qs.index+1} من ${qs.questions.length}</small>
      </div>
      ${qs.mode!=="practice"?`<div class="timer" id="quizTimer">${I.clock} ${formatTime(qs.seconds)}</div>`:`<div class="timer">${I.book} تدريب</div>`}
      </div>
      <div class="progress"><i style="width:${progress}%"></i></div>
    </div>
    <div class="question-card">
      <div class="qtop"><span class="chip">${I.target} السؤال ${qs.index+1}</span><span>${answeredCount}/${qs.questions.length} مُجاب</span></div>
      <div class="question">${esc(q.q)}</div>
      <div class="options">${opts}</div>${feedback}
    </div>
    <div class="btn-row" style="margin-top:12px">
      ${qs.index>0?`<button class="secondary" onclick="prevQ()">${I.arrowR} السابق</button>`:""}
      ${!isLast?`<button class="primary" onclick="nextQ()">التالي ${I.arrowL}</button>`
        :`<button class="success" onclick="finishQuiz(false)">${I.check} إنهاء</button>`}
      <button class="danger" onclick="cancelQuiz()">${I.x} إلغاء</button>
    </div>`,"");
}
function chooseAnswer(i){const qs=state.quiz;if(!qs||qs.revealed[qs.index])return;qs.answers[qs.index]=i;if(qs.mode==="practice") qs.revealed[qs.index]=true;renderQuiz()}
function nextQ(){const qs=state.quiz;if(!qs)return;if(qs.answers[qs.index]===null){toast("اختر إجابة");return}if(qs.mode==="practice" && !qs.revealed[qs.index]){qs.revealed[qs.index]=true;renderQuiz();return}if(qs.index<qs.questions.length-1){qs.index++;renderQuiz()}}
function prevQ(){const qs=state.quiz;if(qs&&qs.index>0){qs.index--;renderQuiz()}}
function cancelQuiz(){
  const qs=state.quiz;if(!qs)return;
  if(!confirm("إلغاء الاختبار؟"))return;
  clearInterval(quizTimer);state.quiz=null;_skipQuizConfirm=true;
  try{ history.back(); }catch(e){ state.view="subject";render(); }
}
async function finishQuiz(auto){
  const qs=state.quiz; if(!qs||qs.finished)return;
  if(!auto && qs.answers.includes(null)){ if(!confirm("هناك أسئلة غير مُجابة. إنهاء؟"))return; }
  clearInterval(quizTimer);
  let score=0;const wrongIdx=[];
  try{qs.questions.forEach((q,i)=>{if(!q)return;if(qs.answers[i]===q.correct)score++;else wrongIdx.push(q._origIndex!==undefined?q._origIndex:i)})}catch(e){score=0}
  const percent=qs.questions.length?Math.round(score/qs.questions.length*100):0;
  const lsInfo=findLessonSubject(qs.lessonId);
  const subjName=lsInfo?lsInfo.s.name:"", lessonName=lsInfo?lsInfo.l.name:"";
  let earned=score*10; if(percent===100) earned+=20; else if(percent>=80) earned+=5;
  const result={id:uid("r"),lessonId:qs.lessonId,lessonName,subjectName:subjName,score,total:qs.questions.length,percent,wrongIdx,mode:qs.mode,date:new Date().toISOString(),points:earned,deviceId:DEVICE_ID,userName:db.user.name};
  try{
    db.results.push(result);
    db.user.quizzesTaken=(db.user.quizzesTaken||0)+1;
    db.user.correctTotal=(db.user.correctTotal||0)+score;
    db.user.totalQuestions=(db.user.totalQuestions||0)+qs.questions.length;
    db.user.points=(db.user.points||0)+earned;
    if(db.users){const u=db.users.find(x=>x.deviceId===DEVICE_ID);if(u){u.points=db.user.points;u.lastSeen=new Date().toISOString()}}
    saveDB();
    // Sync to cloud
    firestorePushResult(result);
    firestoreSyncUser(DEVICE_ID, {
      name: db.user.name,
      points: db.user.points,
      quizzesTaken: db.user.quizzesTaken,
      correctTotal: db.user.correctTotal,
      deviceInfo: DEVICE_INFO
    });
  }catch(e){ try{saveDB()}catch(_){} }
  qs.result=result;qs.finished=true;state.view="quizResult";renderQuizResult();
}

function computeLeaderboard(){
  const me={name:db.user.name||"طالب",avatar:db.user.avatar,points:db.user.points||0,isMe:true,quizzes:db.user.quizzesTaken||0};
  const bots=[
    {name:"أحمد الشامي",avatar:"🦁",points:1240,quizzes:42,isMe:false},
    {name:"سارة العلي",avatar:"🦊",points:980,quizzes:35,isMe:false},
    {name:"محمد ياسين",avatar:"🐯",points:870,quizzes:28,isMe:false},
    {name:"ليان حمد",avatar:"🐼",points:720,quizzes:22,isMe:false},
    {name:"عمر الخطيب",avatar:"🐺",points:590,quizzes:18,isMe:false},
    {name:"نور الهدى",avatar:"🦉",points:460,quizzes:14,isMe:false},
    {name:"يوسف نصر",avatar:"🦅",points:320,quizzes:10,isMe:false},
    {name:"هبة سالم",avatar:"🌟",points:190,quizzes:6,isMe:false},
    {name:"رامي فؤاد",avatar:"⚡",points:80,quizzes:3,isMe:false}
  ];
  return [...bots,me].sort((a,b)=>b.points-a.points);
}
function getUserRank(){const all=computeLeaderboard();const idx=all.findIndex(x=>x.isMe);return idx>=0?idx+1:all.length}
function renderLeaderboard(){
  const all=computeLeaderboard();
  const [first,second,third]=all;
  const me=all.find(x=>x.isMe);
  const myRank=all.findIndex(x=>x.isMe)+1;
  const podiumItem=(user,place)=>{
    if(!user)return"";
    const cls=place===1?"first":place===2?"second":"third";
    return `<div class="podium-item ${cls}">${place===1?'<div class="podium-crown">👑</div>':""}
      <div class="rank-num">${place}</div>
      <div class="podium-avatar">${renderAvatar(user)}</div>
      <b>${esc(user.name)}${user.isMe?' (أنت)':''}</b>
      <div class="pts">${I.star} ${user.points}</div></div>`;
  };
  return `<div class="section-title"><h2>${I.trophy} لوحة الصدارة</h2></div>
  <div class="podium">${podiumItem(second,2)}${podiumItem(first,1)}${podiumItem(third,3)}</div>
  <div class="section-title" style="margin-top:18px"><h2>${I.award} الترتيب الكامل</h2><span>${all.length} طالب</span></div>
  <div class="lb-list">${all.map((u,i)=>`
    <div class="lb-row ${u.isMe?'me':''}">
      <div class="pos ${i<3?'top':''}">${i+1}</div>
      <div class="lb-avatar">${renderAvatar(u)}</div>
      <div class="lb-info"><b>${esc(u.name)}${u.isMe?' · أنت':''}</b><small>${u.quizzes||0} اختبار • ${u.points} نقطة</small></div>
      <div class="lb-pts">${I.star} ${u.points}</div>
    </div>`).join("")}
  </div>
  <div class="notice" style="margin-top:14px">${I.info}<span>ترتيبك: <b>#${myRank}</b> • النقاط: <b>${me.points}</b></span></div>`;
}

}

async function refreshUsersFromCloud(){
  if(!cloud.ok){toast("السحابة غير متصلة");return}
  const list = await firestoreFetchUsers();
  if(!list){toast("فشل التحديث");return}
  // Merge into db.users
  if(!db.users) db.users=[];
  list.forEach(u=>{
    const existing = db.users.find(x=>x.deviceId===u.deviceId);
    if(existing){
      existing.name = u.name || existing.name;
      existing.points = u.points!=null?u.points:existing.points;
      existing.deviceInfo = u.deviceInfo || existing.deviceInfo;
      existing.lastSeen = u.lastSeen || existing.lastSeen;
    } else {
      db.users.push({
        id: uid("u"),
        name: u.name || "طالب",
        deviceId: u.deviceId,
        deviceInfo: u.deviceInfo||{},
        createdAt: u.joinedAt || new Date().toISOString(),
        lastSeen: u.updatedAt || new Date().toISOString(),
        points: u.points||0
      });
    }
  });
  saveDB();render();toast("تم استيراد "+list.length+" مستخدم من السحابة");
}

async function banDevice(deviceId, name){
  if(!confirm(`حظر "${name||deviceId}" نهائياً؟\n\n⚠️ سيُطبَّق الحظر فوراً على جهاز المستخدم حتى لو كان التطبيق مفتوحاً.`))return;
  // 1) Local
  if(!db.bannedDevices) db.bannedDevices=[];
  if(db.bannedDevices.indexOf(deviceId)===-1) db.bannedDevices.push(deviceId);
  saveDB();
  await applyLocalBan(deviceId, "");
  // 2) Cloud
  const cloudOk = await firestoreSetBan(deviceId, {
    name: name||"",
    reason: "",
    bannedBy: db.user.name || "admin"
  });
  // 3) If self → lock now
  if(deviceId === DEVICE_ID){ _isBanned = true; }
  // 4) Refresh admin list
  await loadCloudBansIntoState();
  render();
  toast(cloudOk ? "تم الحظر (محلي + سحابي) 🚫" : "تم الحظر محلياً — السحابة غير متصلة");
}

async function unbanDevice(deviceId){
  if(!confirm("فك الحظر عن هذا الجهاز؟"))return;
  db.bannedDevices=(db.bannedDevices||[]).filter(d=>d!==deviceId);
  saveDB();
  await removeLocalBan(deviceId);
  const cloudOk = await firestoreRemoveBan(deviceId);
  if(deviceId === DEVICE_ID){ _isBanned=false; }
  await loadCloudBansIntoState();
  render();
  toast(cloudOk ? "تم فك الحظر (محلي + سحابي)" : "تم محلياً");
}

async function manualBanDevice(){
  const v=document.getElementById("manualBanId").value.trim();

  await banDevice(v, "");
}

  <button class="primary" style="width:100%" onclick="saveQuestion()">${I.save} حفظ</button>`);
}
function saveQuestion(){
  const l=lessonBy(document.getElementById("qLesson").value);
  const q=document.getElementById("qText").value.trim();
  const a=[qa.value.trim(),qb.value.trim(),qc.value.trim(),qd.value.trim()];
  if(!q||a.some(x=>!x)||!l)return toast("أكمل البيانات");
  l.questions.push({q,a,correct:Number(document.getElementById("qCorrect").value),exp:document.getElementById("qExp").value.trim()});
  saveDB();closeModal();render();toast("تم");
}
function manageQuestions(id){
  const l=lessonBy(id);if(!l)return;
  const items=l.questions.map((q,i)=>`
    <div class="lesson" style="flex-wrap:wrap">
      <div style="flex:1;min-width:180px">
        <b style="font-size:12.5px">${i+1}. ${esc(q.q)}</b>
        <small>A: ${esc(q.a[0])} • B: ${esc(q.a[1])} • C: ${esc(q.a[2])} • D: ${esc(q.a[3])}</small>
        <div style="color:var(--green);font-size:11px;margin-top:4px;font-weight:800">✓ ${String.fromCharCode(65+q.correct)} - ${esc(q.a[q.correct])}</div>
      </div>
      <button class="mini-btn danger" onclick="deleteQuestion('${id}',${i})">${I.trash}</button>
    </div>`).join("");
  showModal(`<div class="modal-head"><h2>${I.layers} ${esc(l.name)}</h2><button class="icon-btn" onclick="closeModal()">${I.x}</button></div>
  <div class="btn-row" style="margin-bottom:10px">
    <button class="primary" onclick="closeModal();newQuestion('${id}')">${I.plus} جديد</button>
    <button class="warn" onclick="closeModal();importQuestionsJSONFor('${id}')">${I.code} JSON</button>
    <button class="danger" onclick="deleteAllQuestions('${id}')">${I.trash} الكل</button>
  </div>
  ${items||`<div class="empty">لا توجد أسئلة.</div>`}`);
}
function deleteQuestion(lid,i){
  const l=lessonBy(lid);if(!l)return;
  if(confirm("حذف السؤال؟")){l.questions.splice(i,1);saveDB();closeModal();manageQuestions(lid);toast("تم")}
}
function deleteAllQuestions(lid){
  const l=lessonBy(lid);if(!l)return;
  if(!confirm(`حذف كل أسئلة "${l.name}"؟`))return;
  l.questions=[];saveDB();closeModal();render();toast("تم");
}

  const ls=[];

  showModal(`<div class="modal-head"><h2>${I.code} استيراد JSON</h2><button class="icon-btn" onclick="closeModal()">${I.x}</button></div>
  <div class="field"><label>الدرس</label><select id="jsonLesson">${ls.join("")}</select></div>
  <div style="height:8px"></div>
  <div class="field"><label>مصفوفة JSON (عدد غير محدود)</label>
    <textarea id="jsonText" class="code" rows="10" placeholder='[{"q":"سؤال","a":["أ","ب","ج","د"],"correct":0}]'></textarea></div>
  <div class="code-sample">FORMAT:
[{"q":"...", "a":["A","B","C","D"], "correct":0, "exp":"..."}]
correct: 0=أ, 1=ب, 2=ج, 3=د</div>

function importQuestionsJSONFor(lessonId){
  const ls=[];
  db.subjects.forEach(s=>s.units.forEach(u=>u.lessons.forEach(l=>ls.push(`<option value="${l.id}" ${l.id===lessonId?"selected":""}>${esc(s.name)} — ${esc(l.name)} (${l.questions.length})</option>`))));
  if(!ls.length)return toast("أضف درساً أولاً");
  showModal(`<div class="modal-head"><h2>${I.code} استيراد JSON</h2><button class="icon-btn" onclick="closeModal()">${I.x}</button></div>
  <div class="field"><label>الدرس</label><select id="jsonLesson">${ls.join("")}</select></div>
  <div style="height:8px"></div>
  <div class="field"><label>مصفوفة JSON</label>
    <textarea id="jsonText" class="code" rows="10" placeholder='[{"q":"...","a":["A","B","C","D"],"correct":0}]'></textarea></div>
  <div class="code-sample">FORMAT:
[{"q":"...", "a":["A","B","C","D"], "correct":0, "exp":"..."}]</div>
  <div style="height:12px"></div>
  <div class="btn-row">
    <button class="primary" onclick="parseAndImportQuestions()">${I.check} استيراد</button>
    <button class="secondary" onclick="copyJSONSample()">${I.copy} مثال</button>
  </div>`);
}
function copyJSONSample(){
  const sample = JSON.stringify([
    {q:"ما هي عاصمة سوريا؟", a:["حلب","دمشق","حمص","اللاذقية"], correct:1, exp:"دمشق هي العاصمة."},
    {q:"2 + 2 =", a:["3","4","5","6"], correct:1}
  ], null, 2);
  try{
    if(navigator.clipboard) navigator.clipboard.writeText(sample);
    const ta=document.getElementById("jsonText");
    if(ta)ta.value=sample;
    toast("تم إدراج المثال");
  }catch(e){
    const ta=document.getElementById("jsonText");
    if(ta)ta.value=sample;
  }
}
function parseAndImportQuestions(){
  const lessonId=document.getElementById("jsonLesson").value;
  const text=(document.getElementById("jsonText").value||"").trim();
  if(!text){toast("الصق JSON أولاً");return}
  let data;
  try{ data=JSON.parse(text); }catch(e){ toast("JSON غير صالح"); return; }
  let arr = Array.isArray(data) ? data : (data && Array.isArray(data.questions) ? data.questions : null);
  if(!arr || !arr.length){ toast("مصفوفة أسئلة فارغة"); return; }
  const l=lessonBy(lessonId);
  if(!l){ toast("الدرس غير موجود"); return; }
  let added=0, failed=0;
  arr.forEach(item=>{
    try{
      if(!item || typeof item!=="object"){ failed++; return; }
      const q=String(item.q||"").trim();
      if(!q){ failed++; return; }
      let a=item.a;
      if(!Array.isArray(a) || a.length<2){ failed++; return; }
      a=a.map(x=>String(x==null?"":x));
      while(a.length<4) a.push("");
      a=a.slice(0,4);
      if(a.some(x=>!x.trim())){ failed++; return; }
      const correct=Number(item.correct);
      if(isNaN(correct)||correct<0||correct>3){ failed++; return; }
      l.questions.push({q,a,correct,exp:item.exp?String(item.exp):""});
      added++;
    }catch(e){ failed++; }
  });
  if(added){
    saveDB();closeModal();render();
    toast(failed?`تم استيراد ${added}، فشل ${failed}`:`✓ تم استيراد ${added} سؤال`);
  } else toast("لم يتم استيراد أي سؤال");
}

function importDB(e){
  const file=e.target.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=async ()=>{
    try{
      const x=JSON.parse(r.result);
      if(!x.subjects||!x.settings)throw Error();
      if(!x.user)x.user=cloneDB(defaultDB.user);
      if(!x.users)x.users=[];
      if(!x.bannedDevices)x.bannedDevices=[];
      db=x;saveDB();
      for(const d of (db.bannedDevices||[])){
        await applyLocalBan(d, "imported");
      }
      _isBanned = await checkLocalBan();
      render();toast("تم الاستيراد");
    }catch(err){toast("ملف غير صالح")}
  };
  r.readAsText(file);
}
async function resetDB(){
  if(!confirm("إعادة النظام للافتراضي؟\n\n⚠️ الحظر السحابي لن يُحذف."))return;
  const keepBanned = (db.bannedDevices||[]).slice();
  db=cloneDB(defaultDB);
  db.bannedDevices = keepBanned;
  saveDB();navStack=[];
  for(const d of keepBanned){ await applyLocalBan(d, ""); }
  _isBanned = await checkLocalBan();
  render();toast("تم");
}

/* =========================================================
   ★★★ BAN WATCHER — يستقبل الحظر فورياً من السحابة ★★★
   ========================================================= */
function setupBanWatcher(){
  if(cloud.banUnsubscribe){ try{ cloud.banUnsubscribe(); }catch(e){} cloud.banUnsubscribe=null; }
  if(!cloud.ok){ return; }
  cloud.banUnsubscribe = firestoreWatchBan(DEVICE_ID, async (banned, data)=>{
    if(banned){
      if(!_isBanned){
        _isBanned = true;
        _banReason = (data && data.reason) || "";
        // Sync local layers so it persists offline
        await applyLocalBan(DEVICE_ID, _banReason);
        if((db.bannedDevices||[]).indexOf(DEVICE_ID)===-1){
          if(!db.bannedDevices) db.bannedDevices=[];
          db.bannedDevices.push(DEVICE_ID);
          saveDB();
        }
        // Kick out immediately
        clearInterval(quizTimer);
        state.quiz=null;
        render();
        toast("🚫 تم حظر هذا الجهاز");
      }
    } else {
      // Unbanned remotely
      if(_isBanned){
        _isBanned = false;
        _banReason = "";
        await removeLocalBan(DEVICE_ID);
        db.bannedDevices = (db.bannedDevices||[]).filter(d=>d!==DEVICE_ID);
        saveDB();
        render();
        toast("✓ تم فك الحظر");
      }
    }
  });
}

/* =========================================================
   ★★★ BOOT ★★★
   ========================================================= */
(async function boot(){
  // 1. Device fingerprint
  try{ await buildDeviceId(); }
  catch(e){ if(!DEVICE_ID) DEVICE_ID="DEV-UNKNOWN-000000"; }

  // 2. Local ban check (5 layers)
  try{ _isBanned = await checkLocalBan(); }
  catch(e){ _isBanned = false; }

  // 3. Render early (with local state) so user sees UI fast
  try{ history.pushState({ depth:0 }, ""); }catch(e){}
  render();

  // 4. Init Firebase (async, doesn't block UI)
  initFirebase().then(async (ok)=>{
    if(ok){
      // 4a. Check cloud ban for this device
      const cloudBan = await firestoreCheckBan(DEVICE_ID);
      if(cloudBan){
        _isBanned = true;
        _banReason = cloudBan.reason || "";
        await applyLocalBan(DEVICE_ID, _banReason);
        if((db.bannedDevices||[]).indexOf(DEVICE_ID)===-1){
          if(!db.bannedDevices) db.bannedDevices=[];
          db.bannedDevices.push(DEVICE_ID);
          saveDB();
        }
      } else if(_isBanned){
        // Local ban but no cloud ban → keep local ban (admin banned locally)
        // Optional: uncomment next line to also sync local→cloud
        // await firestoreSetBan(DEVICE_ID, { reason: _banReason });
      }

      // 4b. Watch for live ban changes
      setupBanWatcher();

      // 4c. Sync our user to cloud
      if(db.user && db.user.name){
        firestoreSyncUser(DEVICE_ID, {
          name: db.user.name,
          deviceInfo: DEVICE_INFO,
          points: db.user.points||0,
          quizzesTaken: db.user.quizzesTaken||0,
          correctTotal: db.user.correctTotal||0,
          joinedAt: db.user.joinedAt
        });
      }

      // 4d. Load cloud bans for admin view
      const list = await firestoreFetchBans();
      if(list) state.cloudBans = list;

      // Re-render to show cloud status
      render();
    } else {
      render();
    }
  });

  // 5. Re-check ban when tab becomes visible
  document.addEventListener("visibilitychange", async ()=>{
    if(!document.hidden){
      const local = await checkLocalBan();
      if(local && !_isBanned){ _isBanned=true; render(); return; }
      if(cloud.ok){
        const cb = await firestoreCheckBan(DEVICE_ID);
        if(cb && !_isBanned){
          _isBanned=true;
          _banReason = cb.reason||"";
          await applyLocalBan(DEVICE_ID, _banReason);
          render();
        }
      }
    }
  });
})();
